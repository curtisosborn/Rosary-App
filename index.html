<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Rosary</title>
<meta name="description" content="A guided family rosary with daily mysteries and meditations for kids.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rosary">
<meta name="theme-color" content="#FCF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#020614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{background:#FCF6EE}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one-screen app. Home scrolls above a fixed Begin/Continue foot; prayer mode = bead bar on top, one prayer centered, big Next at the thumb. */
:root{
  --teal:#096B82; --gold:#E5AD35; --rose:#C9767A;
  --bg:#FCF6EE; --surface:#FFFDF9; --ink:#14353D; --muted:#5B6E71; --line:#E9DCCB;
  --primary:var(--teal); --on-primary:#FFFDF9; --accent:var(--rose); --cta-bg:#FBEDE8;
  --bead:#D8CCBC; --bead-on:var(--gold); --bead-done:var(--rose);
  --h0:#ECE4D8; --h1:#F0C6C8; --h2:#D7878B; --h3:#A64C53;
  --mantle:var(--teal); --stars:none; --stars-size:auto;
  --scrim:rgba(20,53,61,.45);
  --display:"Marcellus", "Trajan Pro", Georgia, serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --scale:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#020614; --surface:#081128; --ink:#F7F2E8; --muted:#A9B4CC; --line:#152447;
  --primary:#E2B65A; --on-primary:#020614; --accent:#A9C0EE; --cta-bg:#0A1634;
  --bead:#1E3161; --bead-on:#E2B65A; --bead-done:#8FA9DD;
  --h0:#0D1838; --h1:#6A3B49; --h2:#B66E79; --h3:#EFAAB0;
  --mantle:#1B3B85; --scrim:rgba(2,6,20,.6);
  --stars:radial-gradient(circle at 18% 22%, rgba(233,201,130,.55) 0 1px, transparent 1.6px), radial-gradient(circle at 63% 71%, rgba(255,255,255,.35) 0 .8px, transparent 1.4px), radial-gradient(circle at 82% 12%, rgba(233,201,130,.4) 0 1.2px, transparent 1.9px);
  --stars-size:170px 170px, 230px 230px, 310px 310px;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#020614; --surface:#081128; --ink:#F7F2E8; --muted:#A9B4CC; --line:#152447;
  --primary:#E2B65A; --on-primary:#020614; --accent:#A9C0EE; --cta-bg:#0A1634;
  --bead:#1E3161; --bead-on:#E2B65A; --bead-done:#8FA9DD;
  --h0:#0D1838; --h1:#6A3B49; --h2:#B66E79; --h3:#EFAAB0;
  --mantle:#1B3B85; --scrim:rgba(2,6,20,.6);
  --stars:radial-gradient(circle at 18% 22%, rgba(233,201,130,.55) 0 1px, transparent 1.6px), radial-gradient(circle at 63% 71%, rgba(255,255,255,.35) 0 .8px, transparent 1.4px), radial-gradient(circle at 82% 12%, rgba(233,201,130,.4) 0 1.2px, transparent 1.9px);
  --stars-size:170px 170px, 230px 230px, 310px 310px;
  color-scheme:dark }

html,body{height:100%}
body{background-color:var(--bg); background-image:var(--stars); background-size:var(--stars-size); color:var(--ink); font-family:var(--body); font-size:calc(19px * var(--scale)); line-height:1.6; -webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{height:100%; display:flex; flex-direction:column; max-width:760px; margin:0 auto}
.screen{flex:1; min-height:0; display:flex; flex-direction:column}
.scroll{flex:1; min-height:0; overflow-y:auto; padding-inline:20px; padding-block:6px 28px}

/* Guadalupe star band */
.mantle{height:10px; flex:none; background:var(--mantle) radial-gradient(circle, var(--gold) 1.4px, transparent 1.8px) 0 0/22px 10px}

/* Home */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-inline:20px; padding-block:16px 4px}
.brand{font-family:var(--display); font-weight:400; font-size:1.55rem; letter-spacing:.02em; color:var(--primary); margin:0}
.gearbtn{width:44px; height:44px; flex:none; border:0; background:transparent; border-radius:50%; display:grid; place-items:center; color:var(--muted)}
.gearbtn:hover{background:var(--surface)}
.date{font-style:italic; font-size:.9rem; color:var(--muted); margin:0}
.feast{display:flex; align-items:baseline; gap:10px; margin:6px 0 0; font-family:var(--display); font-size:1.15rem; line-height:1.35; text-wrap:balance}
.feast svg{flex:none; width:12px; height:17px; color:var(--gold); transform:translateY(2px)}
.home-stack{display:grid; gap:26px; margin-top:18px}
.mysteries{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px}
.mysteries h2{font-family:var(--display); font-weight:400; font-size:1.75rem; line-height:1.2; margin:0; color:var(--primary)}
.mysteries ol{margin:10px 0 10px; padding-left:1.4em; font-size:.92em}
.mysteries li::marker{color:var(--muted); font-size:.85em}
.why{font-style:italic; font-size:.85rem; color:var(--muted); margin:0 0 12px}
.chooser{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 14px; font-size:.82rem; font-weight:600; min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary); color:var(--on-primary); border-color:var(--primary)}

.picker{position:relative; display:grid; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 48px 12px 16px}
.pk-label{font-style:italic; font-size:.78rem; color:var(--muted)}
.picker select{appearance:none; -webkit-appearance:none; border:0; background:transparent; padding:0; border-radius:0; font-family:var(--display); font-size:1.15rem; line-height:1.3; color:var(--primary); width:100%; min-width:0; cursor:pointer}
.picker select:focus-visible{outline:none}
.picker:focus-within{outline:3px solid var(--gold); outline-offset:2px}
.mysteries .picker{background:var(--bg); border:1px solid color-mix(in srgb, var(--muted) 38%, transparent); border-radius:12px; padding:8px 36px 10px 14px}
.mysteries .picker svg{right:12px}
.mysteries ol{margin:10px 0 0}
.picker svg{position:absolute; right:18px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 10px}
.sec-h h3{font-family:var(--display); font-weight:400; font-size:1.25rem; margin:0}
.sec-h span{font-style:italic; font-size:.82rem; color:var(--muted); white-space:nowrap}

/* Prayer-days heat map: columns are weeks, rows are Sun..Sat */
.heat{display:grid; grid-template-columns:16px repeat(var(--weeks), minmax(0,1fr)); grid-template-rows:auto repeat(7, auto); gap:3px}
.heat .mo{grid-row:1; font-size:.68rem; color:var(--muted); white-space:nowrap; line-height:1.4; overflow:visible}
.heat .dl{grid-column:1; font-size:.62rem; color:var(--muted); line-height:1; align-self:center}
.cell{aspect-ratio:1; width:100%; border:0; padding:0; border-radius:3px; background:var(--h0); min-width:0}
.cell.l1{background:var(--h1)} .cell.l2{background:var(--h2)} .cell.l3{background:var(--h3)}
.cell.today{box-shadow:0 0 0 1.5px var(--bg), 0 0 0 3px var(--gold)}
.cell.future{visibility:hidden}
.cell.sel{box-shadow:0 0 0 2px var(--ink)}
.heat-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; flex-wrap:wrap}
.daynote{font-size:.85rem; color:var(--muted); margin:0; min-height:1.4em; min-width:0}
.legend{display:flex; align-items:center; gap:4px; font-size:.7rem; color:var(--muted)}
.legend i{width:11px; height:11px; border-radius:2px; display:inline-block}

.themes{display:grid; gap:8px}
.theme{display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 14px; min-height:52px; font-size:1rem}
.theme[aria-checked="true"]{border:2px solid var(--primary); padding:11px 13px}
.theme .dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex:none}
.theme[aria-checked="true"] .dot{border:6px solid var(--primary)}

.home-foot{flex:none; display:grid; gap:4px; padding-inline:20px; padding-block:12px 14px; border-top:1px solid var(--line); background:var(--bg)}
.primary{width:100%; min-height:64px; border:0; border-radius:18px; background:var(--primary); color:var(--on-primary); font-family:var(--display); font-size:1.5rem; letter-spacing:.04em; display:grid; place-content:center; line-height:1.15; padding:8px 16px}
.primary .sub{font-family:var(--body); font-size:.8rem; letter-spacing:0; opacity:.85; margin-top:3px}
.primary:active{transform:translateY(1px)}
.textbtn{border:0; background:transparent; min-height:44px; font-size:.9rem; color:var(--muted); text-decoration:underline; text-underline-offset:3px}

/* Prayer mode */
.pray-head{flex:none; display:flex; align-items:center; gap:10px; padding-inline:12px; padding-block:10px 4px}
.beadwrap{flex:1; min-width:0; height:56px; position:relative; overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent)}
.track{position:absolute; top:0; left:0; height:56px; display:flex; align-items:center; transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.track::before{content:""; position:absolute; left:28px; right:28px; top:50%; height:1.5px; background:var(--line)}
.slot{width:56px; flex:none; display:grid; place-items:center; position:relative}
.bead{border-radius:50%; background:var(--bead); transition:transform .3s, background .3s}
.bead.s{width:15px; height:15px}
.bead.l{width:24px; height:24px}
.bead.medal{width:22px; height:28px; border-radius:45%; background:transparent; border:3px solid var(--bead)}
.bead.done{background:var(--bead-done)}
.bead.medal.done{background:transparent; border-color:var(--bead-done)}
.bead.on{background:var(--bead-on); transform:scale(1.35); box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 28%, transparent)}
.bead.medal.on{background:transparent; border-color:var(--gold)}
.cross{width:22px; height:32px; color:var(--bead); transition:color .3s, transform .3s}
.cross.on{color:var(--gold); transform:scale(1.2)}
.pause{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; min-height:44px; padding:0 16px; font-size:.85rem; font-weight:600}
.where{flex:none; text-align:center; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:2px 0 0; min-height:1.3em}
.prayer{flex:1; min-height:0; overflow-y:auto; padding-inline:22px; padding-block:18px 24px; display:flex; flex-direction:column}
.prayer-inner{margin:auto 0; display:grid; gap:14px; max-width:34em; width:100%; align-self:center}
.prayer-inner.enter{animation:enter .32s ease-out}
@keyframes enter{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.prayer h1{font-family:var(--display); font-weight:400; font-size:1.75rem; line-height:1.25; margin:0; color:var(--primary); text-wrap:balance}
.kicker{font-style:italic; font-size:.95rem; color:var(--accent); margin:0}
.text{font-size:1.12em; line-height:1.65; margin:0}
.text p{margin:0 0 .7em}
.parts{display:grid; gap:14px; font-size:1.12em; line-height:1.65}
.part p{margin:0}
.who{display:block; font-style:italic; font-size:.68em; color:var(--muted); margin-bottom:2px}
.part.all{border-left:3px solid var(--accent); padding-left:14px}
.part.all .who{color:var(--accent)}
.vr{display:grid; gap:4px}
.vr b{color:var(--accent); margin-right:6px}
.note{font-size:.9rem; color:var(--muted); margin:0}
.en-sub{font-style:italic; font-size:.9rem; color:var(--muted); margin:-8px 0 0}
.en-under{border-top:1px solid var(--line); padding-top:12px; font-style:italic; color:var(--muted); font-size:.92em}
.en-under p{margin:0 0 .6em}
.meditation{font-size:1.02em; line-height:1.7; margin:0}
.cta{background:var(--cta-bg); border-radius:14px; padding:14px 16px; margin:0; display:grid; gap:4px}
.cta h2{font-family:var(--display); font-weight:400; font-size:1.1rem; color:var(--primary); margin:0}
.ask{font-family:var(--display); font-weight:400; font-size:1.65rem; line-height:1.3; color:var(--ink); margin:0; text-wrap:balance}
.saints{list-style:none; padding:0; margin:0; display:grid; gap:6px; font-size:1.1em}
.count{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.count i{width:10px; height:10px; border-radius:50%; background:var(--bead); transition:background .25s, transform .25s}
.count i.done{background:var(--bead-done)}
.count i.on{background:var(--gold); transform:scale(1.45)}
.taphint{font-style:italic; font-size:.85rem; color:var(--muted); margin:0}
.offered{font-style:italic; font-size:1.05rem; margin:0}
.offered b{font-style:normal; font-weight:600}
textarea.intent{min-height:76px}
.week{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; max-width:300px}
.week div{display:grid; gap:4px; justify-items:center; font-size:.7rem; color:var(--muted)}
.week .cell{border-radius:5px}
.week .cell.new{animation:glow 1.1s ease-out .3s both}
@keyframes glow{from{background:var(--h0); transform:scale(.6)} 60%{transform:scale(1.15)} to{transform:none}}
.pray-foot{flex:none; display:grid; grid-template-columns:1fr 2.4fr; gap:10px; padding-inline:16px; padding-block:10px 16px; border-top:1px solid var(--line)}
.back{min-height:64px; border:1px solid var(--line); background:var(--surface); border-radius:18px; font-weight:600; font-size:1rem}
.back[disabled]{opacity:.4}

/* Sheets */
.sheet{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:10}
.sheet-card{background:var(--bg); width:100%; max-width:760px; border-radius:22px 22px 0 0; padding-inline:20px; padding-block:20px calc(20px + env(safe-area-inset-bottom, 0px)); display:grid; gap:12px}
.sheet-card h2{font-family:var(--display); font-weight:400; margin:0; font-size:1.5rem}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ghost{min-height:56px; border:1px solid var(--line); background:var(--surface); border-radius:16px; font-weight:600}
.solid{min-height:56px; border:0; background:var(--primary); color:var(--on-primary); border-radius:16px; font-weight:600}

.settings{position:fixed; inset:0; background:var(--bg); z-index:9; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding-block:env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px)}
.settings .scroll{display:grid; gap:24px; align-content:start; padding-block:12px 28px}
.group{display:grid; gap:10px}
.group h3{font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0; border-bottom:1px solid var(--line); padding-bottom:6px}
.opt{display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:44px; font-size:1rem}
.opt span{min-width:0}
.opt small{display:block; color:var(--muted); font-size:.82rem}
.switch{appearance:none; -webkit-appearance:none; width:52px; height:30px; border-radius:999px; background:var(--line); position:relative; flex:none; cursor:pointer; transition:background .2s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .2s}
.switch:checked{background:var(--primary)}
.switch:checked::after{left:25px}
select,textarea,input[type=text]{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 12px; font-size:1rem}
textarea{min-height:110px; resize:vertical}
.sizes{display:flex; gap:8px; flex-wrap:wrap}
.hint{font-size:.85rem; color:var(--muted); margin:0}
.donebtn{border:0; background:var(--primary); color:var(--on-primary); border-radius:999px; min-height:44px; padding:0 18px; font-weight:600; font-size:.9rem}

@media (prefers-reduced-motion: reduce){ .track,.bead,.cross,.count i{transition:none} .prayer-inner.enter,.week .cell.new{animation:none} }
@media (min-width:700px){ .prayer h1{font-size:2.15rem} .text,.parts{font-size:1.2em} }
</style>
<style>html{background:var(--bg)}</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ---------- Content ---------- */
const P = {
  sign:"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.",
  creed:"I believe in God, the Father Almighty, Creator of heaven and earth; and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died, and was buried. He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God, the Father Almighty; from there He shall come to judge the living and the dead.\n\nI believe in the Holy Spirit, the holy Catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.",
  ourFather:"Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come, Thy will be done on earth as it is in heaven.\n\nGive us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.",
  hailMary:"Hail Mary, full of grace, the Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus.\n\nHoly Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.",
  glory:"Glory be to the Father, and to the Son, and to the Holy Spirit.\n\nAs it was in the beginning, is now, and ever shall be, world without end. Amen.",
  fatima:"O my Jesus, forgive us our sins, save us from the fires of hell, lead all souls to heaven, especially those in most need of Thy mercy.",
  queen:"Hail, holy Queen, Mother of mercy, our life, our sweetness, and our hope. To thee do we cry, poor banished children of Eve. To thee do we send up our sighs, mourning and weeping in this valley of tears.\n\nTurn then, most gracious advocate, thine eyes of mercy toward us, and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary.",
  letUsPray:"O God, whose only begotten Son, by His life, death, and resurrection, has purchased for us the rewards of eternal life; grant, we beseech Thee, that meditating upon these mysteries of the most holy Rosary of the Blessed Virgin Mary, we may imitate what they contain and obtain what they promise, through the same Christ our Lord. Amen.",
  michael:"Saint Michael the Archangel, defend us in battle. Be our protection against the wickedness and snares of the devil. May God rebuke him, we humbly pray; and do thou, O Prince of the heavenly hosts, by the power of God, cast into hell Satan and all the evil spirits who prowl about the world seeking the ruin of souls. Amen.",
  memorare:"Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection, implored thy help, or sought thine intercession was left unaided. Inspired by this confidence, I fly unto thee, O Virgin of virgins, my Mother. To thee do I come, before thee I stand, sinful and sorrowful. O Mother of the Word Incarnate, despise not my petitions, but in thy mercy hear and answer me. Amen."
};

/* Traditional Latin texts */
const PL = {
  sign:"In nomine Patris, et Filii, et Spiritus Sancti. Amen.",
  creed:"Credo in Deum Patrem omnipotentem, Creatorem caeli et terrae. Et in Iesum Christum, Filium eius unicum, Dominum nostrum, qui conceptus est de Spiritu Sancto, natus ex Maria Virgine, passus sub Pontio Pilato, crucifixus, mortuus, et sepultus, descendit ad inferos, tertia die resurrexit a mortuis, ascendit ad caelos, sedet ad dexteram Dei Patris omnipotentis, inde venturus est iudicare vivos et mortuos.\n\nCredo in Spiritum Sanctum, sanctam Ecclesiam catholicam, sanctorum communionem, remissionem peccatorum, carnis resurrectionem, vitam aeternam. Amen.",
  ourFather:"Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra.\n\nPanem nostrum quotidianum da nobis hodie, et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris. Et ne nos inducas in tentationem, sed libera nos a malo. Amen.",
  hailMary:"Ave Maria, gratia plena, Dominus tecum. Benedicta tu in mulieribus, et benedictus fructus ventris tui, Iesus.\n\nSancta Maria, Mater Dei, ora pro nobis peccatoribus, nunc et in hora mortis nostrae. Amen.",
  glory:"Gloria Patri, et Filio, et Spiritui Sancto.\n\nSicut erat in principio, et nunc, et semper, et in saecula saeculorum. Amen.",
  fatima:"O mi Iesu, dimitte nobis debita nostra, libera nos ab igne inferni, conduc in caelum omnes animas, praesertim illas quae maxime indigent misericordia tua.",
  queen:"Salve, Regina, Mater misericordiae, vita, dulcedo, et spes nostra, salve. Ad te clamamus, exsules filii Hevae. Ad te suspiramus, gementes et flentes in hac lacrimarum valle.\n\nEia, ergo, advocata nostra, illos tuos misericordes oculos ad nos converte. Et Iesum, benedictum fructum ventris tui, nobis post hoc exsilium ostende. O clemens, O pia, O dulcis Virgo Maria.",
  letUsPray:"Deus, cuius Unigenitus per vitam, mortem et resurrectionem suam nobis salutis aeternae praemia comparavit, concede, quaesumus, ut haec mysteria sacratissimo beatae Mariae Virginis Rosario recolentes, et imitemur quod continent, et quod promittunt assequamur. Per eundem Christum Dominum nostrum. Amen.",
  michael:"Sancte Michael Archangele, defende nos in proelio; contra nequitiam et insidias diaboli esto praesidium. Imperet illi Deus, supplices deprecamur; tuque, Princeps militiae caelestis, Satanam aliosque spiritus malignos, qui ad perditionem animarum pervagantur in mundo, divina virtute in infernum detrude. Amen.",
  memorare:"Memorare, O piissima Virgo Maria, non esse auditum a saeculo, quemquam ad tua currentem praesidia, tua implorantem auxilia, tua petentem suffragia, esse derelictum. Ego tali animatus confidentia, ad te, Virgo virginum, Mater, curro, ad te venio, coram te gemens peccator assisto. Noli, Mater Verbi, verba mea despicere, sed audi propitia et exaudi. Amen."
};

};

const THEMES = [
  {id:"neighbor", name:"Loving Our Neighbor", med:{
    joyful:[
      "The angel Gabriel came to Mary with surprising news: God had chosen her to be the mother of Jesus. Mary said yes to God with her whole heart, even though she didn't know everything that would happen. Saying yes to God also meant saying yes to loving others, because Jesus came to love and save every person. God's love always comes to us so it can flow out to others. Every day, God gives us small chances to say yes to love: yes when Mom asks for help, yes when a brother or sister wants to play, yes when someone needs a friend. When we say yes like Mary, we make room for Jesus in our home.",
      "Right after the angel's visit, Mary learned that her older cousin Elizabeth was going to have a baby too. Mary was expecting a baby herself, but she didn't stay home thinking about her own needs. She hurried over the hills to help Elizabeth and stayed for about three months. When Mary arrived, baby John leaped for joy inside Elizabeth! Mary brought Jesus with her wherever she went, and she brought Him to others through her kindness. When we go out of our way to help someone, like a neighbor, a grandparent, or a brother or sister, we carry Jesus to them too. Love doesn't wait to be asked; it hurries to help.",
      "When it was time for Jesus to be born, Mary and Joseph traveled to Bethlehem, but there was no room for them at the inn. Jesus, the King of the whole world, was born in a stable and laid in a manger where animals ate. Poor shepherds came to visit Him, and later wise men came from far away. Jesus welcomed everyone, rich and poor, near and far. Sometimes we act like that crowded inn, with no room for someone who wants to play or talk with us. Jesus asks us to make room in our hearts and our home for everyone, especially people who feel left out. When we welcome others, we welcome Jesus.",
      "When Jesus was a tiny baby, Mary and Joseph brought Him to the Temple to offer Him to God. There they met two very old people, Simeon and Anna, who had been waiting and praying for many years. Simeon held baby Jesus in his arms and thanked God, and Anna told everyone about Him. Mary and Joseph shared their precious baby with these elderly friends. The older people in our lives, like grandparents and elderly neighbors, are a gift from God. They have prayed and loved for a long time, and sometimes they feel forgotten. We love our neighbor when we visit them, listen to their stories, and share our joy with them.",
      "When Jesus was twelve, His family went to Jerusalem for a feast. On the way home, Mary and Joseph realized Jesus was missing! They searched for three days and finally found Him in the Temple, listening to the teachers and asking questions. Mary told Him how worried they had been. Jesus explained that He needed to be in His Father's house, and then He went home with them and obeyed them. Even Jesus, God's own Son, loved His family by listening and obeying. This week, let's each choose one person in our family and do something kind for them every day without being asked, like making their bed, sharing a treat, or telling them something we love about them."
    ],
    luminous:[
      "Jesus went to the Jordan River, where John the Baptist was baptizing people. Jesus had no sin to wash away, but He stepped into the water right alongside sinners and stood with them. When He came up out of the water, the Holy Spirit came down like a dove, and the Father's voice said that Jesus was His beloved Son. At our own baptism, God made each of us His beloved child too. That means every person in our family, and every neighbor, is someone God loves dearly. When we remember that, it's easier to treat each other with care. The next time we're upset with a brother or sister, we can remember that God calls them beloved too.",
      "Jesus, Mary, and the disciples went to a wedding in the town of Cana. During the party, the hosts ran out of wine, which would have been very embarrassing for the new couple. Mary noticed and quietly told Jesus, then told the servants to do whatever He said. Jesus turned six large jars of water into the best wine anyone had tasted! Jesus cared about this family's happiness on their special day, and Mary cared enough to notice. Love pays attention. When we notice that someone is embarrassed, left out, or needs a hand, and we quietly help, we are loving like Jesus and Mary.",
      "Jesus traveled from town to town, teaching that the Kingdom of God was near and calling people to turn away from sin. He healed the sick, welcomed children, ate with people others avoided, and forgave sinners. When someone asked Him who our neighbor is, He told the story of the Good Samaritan, a man who stopped to help a hurt stranger after others walked right by. Jesus taught that our neighbor is anyone who needs our help, even someone very different from us. God's Kingdom grows every time we love like this. In our home, it grows when we forgive quickly, share gladly, and treat each other the way we want to be treated.",
      "Jesus took Peter, James, and John up a high mountain to pray. While He prayed, His face shone like the sun and His clothes became dazzling white. Moses and Elijah appeared and talked with Him, and the Father's voice told the disciples to listen to Jesus. For a moment, the disciples saw how glorious Jesus truly is. Then they had to go back down the mountain to ordinary life. We can't see it with our eyes, but every person we meet is made in God's image and is precious to Him. If we could see our brothers, sisters, and neighbors the way God sees them, we would treat each one with great love and respect.",
      "On the night before He died, Jesus shared a special meal with His apostles. Before they ate, He knelt down and washed their feet, a job usually done by a servant, and told them to serve each other the same way. Then He took bread and wine and gave them His own Body and Blood, the gift we receive at Mass. Jesus gave us the Eucharist so He could stay with us always and make us one family in Him. He asked His friends to love one another just as He had loved them. This week, let's each look for a chance to serve like Jesus did, by doing a humble job nobody wants, like taking out the trash, cleaning up after dinner, or helping a neighbor without being asked."
    ],
    sorrowful:[
      "On the night before He died, Jesus went to a garden to pray. He was very sad and afraid, because He knew how much He would suffer. He asked Peter, James, and John to stay awake and pray with Him, but they kept falling asleep. Even so, Jesus didn't give up on them. He prayed to His Father and accepted God's plan because He loved us so much. When someone we love is sad or having a hard day, we can stay close to them, the way Jesus hoped His friends would. Sometimes the best way to love is simply to be there, give a hug, and pray for them.",
      "Soldiers tied Jesus to a pillar and whipped Him. Jesus had done nothing wrong, but He did not fight back or say mean things. He suffered quietly, because He loved even the people who were hurting Him. That is a very hard kind of love. When someone hurts us with words, pushes us, or takes our things, we want to hurt them back. Jesus shows us a better way: we can stop, take a breath, and choose not to repay hurt with hurt. Loving our neighbor sometimes means being gentle with someone who isn't being gentle with us.",
      "The soldiers made a crown of thorns and pressed it onto Jesus' head. They put a purple robe on Him and laughed, pretending to bow to Him as a king. They were making fun of Him. Jesus really is the King of the whole world, but He let Himself be teased and treated as if He were nothing. Making fun of others hurts their hearts, and it hurts Jesus too, because He loves every person. In our family, we can be careful never to laugh at someone in a mean way or call them names. Instead, we can use our words to build each other up and remind each other how much God loves us.",
      "Jesus had to carry His heavy cross through the streets to the hill where He would die. He was so weak that He fell. The soldiers made a man named Simon of Cyrene help Him carry it. Along the way, Jesus met His mother Mary, and a woman named Veronica wiped His face with her veil. Each of these people helped Jesus in a small way. Everyone around us carries some kind of cross: a brother or sister frustrated with schoolwork, a tired parent, a lonely neighbor. We can be like Simon and Veronica by helping carry each other's burdens, even in small ways.",
      "Jesus was nailed to the cross, and after three hours He died for us. Even while He was suffering, Jesus kept loving. He asked His Father to forgive the people who crucified Him, and He promised the thief beside Him a place in Paradise. He also gave His mother Mary to John, and to all of us, to be our mother. Jesus showed us the greatest love there is by giving His whole life for others. We can give our time, our comfort, and our own way out of love for others too. This week, let's each find one way to put someone else first, like letting a brother or sister go first, giving up the best seat, or doing a hard chore so someone else doesn't have to."
    ],
    glorious:[
      "On Easter morning, Jesus rose from the dead! Just a few days before, His friends had run away and left Him alone when He needed them most. Peter even said three times that he didn't know Jesus. When Jesus came back, He didn't scold them or stay angry. Instead, He greeted them with peace, ate breakfast with them by the sea, and gave Peter a fresh start by trusting him to care for His followers. In our family, we sometimes hurt each other with unkind words or by leaving someone out. Jesus shows us how to forgive, offer peace first, and give each other a fresh start.",
      "Forty days after Easter, Jesus led His friends up a mountain and gave them one last job before going up to Heaven. He told them to go to every part of the world and share God's love with everyone. That's a big job! But Jesus also promised that He would be with them always. Jesus gives us that same job today. We don't have to travel far to start, because our first mission is right here at home, with our brothers and sisters, Mom and Dad. When we share our things, help clean up a mess we didn't make, or speak gently, we are doing Jesus' work.",
      "After Jesus went to Heaven, the apostles and Mary waited and prayed together for nine days. Then a sound like a mighty wind filled the room, and tongues of fire rested on each of them. The Holy Spirit filled their hearts! Suddenly they were brave, and they went out and spoke to people from many countries. Amazingly, everyone heard them in their own language. The Holy Spirit helps people understand each other. When we get frustrated with a brother or sister, or feel like no one is listening, we can ask the Holy Spirit for patience and gentleness. He gives us what we need to love well, especially when it's hard.",
      "When Mary's life on earth was finished, God took her body and soul into Heaven. Think about how Mary lived. When she learned her cousin Elizabeth was going to have a baby, she hurried over the hills to help her. At the wedding at Cana, she noticed the hosts had run out of wine before anyone else did, and she asked Jesus to help. Mary always noticed what others needed, and she didn't wait to be asked. We can be like Mary by keeping our eyes open. Does someone need help carrying something? Is someone sad or left out? Is there a neighbor who might be lonely?",
      "Jesus crowned His mother Queen of Heaven and Earth. But Mary didn't become a queen by being bossy or wanting to be first. She always called herself God's servant. Jesus taught that in God's Kingdom, the greatest is the one who serves the most. Mary is now our Mother and Queen, and she loves every person, including our neighbors and people who are hard to love. As her children, we get to share in her love. This week, let's each choose one way to serve someone, like making a card, helping a neighbor with yard work, or doing a brother's or sister's chore as a surprise."
    ]
  }},
  {id:"patience", name:"Patience", draft:true, med:{"joyful": ["For hundreds of years, God's people waited and prayed for the Savior God had promised. Generation after generation, they kept hoping and trusting, even when it seemed like nothing was happening. Then one day, the angel Gabriel came to Mary with the news that the long wait was almost over. God's timing is not always our timing, but God always keeps His promises. Waiting is hard, especially when we want something right now. Whether we're waiting for a turn, a treat, or an answer to our prayers, we can trust that God is working even when we can't see it. Patience means trusting God while we wait.", "Elizabeth had prayed for a baby for many, many years, and she was old by the time God answered her prayer. When Mary came to visit, Elizabeth was filled with the Holy Spirit and rejoiced. Mary stayed with her for about three months, patiently helping while both babies grew. Babies take nine whole months to grow, and no one can rush them! Some of the best things in life take time, like growing a garden, learning to read, or becoming a kind person. When we feel impatient with how slowly something is going, we can remember that God is growing something good.", "Mary and Joseph traveled a long way to Bethlehem, and when they arrived, there was no room at the inn. They could have complained or gotten angry, but they patiently accepted the stable they were given. That night, Jesus was born there, and a humble stable became the holiest place on earth. Sometimes things don't go the way we planned, and our first feeling is frustration. Mary and Joseph show us how to stay calm and trust God when plans change. God can make something beautiful out of our disappointments. When plans fall apart, let's take a breath and ask God what good He might be bringing.", "When Mary and Joseph brought Jesus to the Temple, they met Simeon and Anna. Simeon had been waiting his whole life to see the Savior, and Anna had prayed in the Temple day and night for many years. They didn't give up, even when they grew old. Finally, God let them see baby Jesus, and their hearts were filled with joy. Simeon and Anna teach us that patient prayer is never wasted. When we pray for something and the answer seems slow, we can keep praying like they did. God hears every prayer, and He answers at just the right time.", "When Jesus was missing, Mary and Joseph searched for Him for three long days. They must have been worried and tired, but they didn't give up, and they kept looking together. When they finally found Him in the Temple, Mary spoke to Him gently about how worried they had been. Then Jesus went home to Nazareth and lived quietly with them for many years before He began His public ministry. Even Jesus waited patiently for God's timing. This week, let's practice patience by waiting our turn without complaining, letting others finish talking before we speak, and saying a quick prayer whenever we feel ourselves getting frustrated."], "luminous": ["Before Jesus began His public ministry, He spent about thirty years living quietly in Nazareth. He worked as a carpenter with Joseph and helped His mother, and most people didn't know who He really was. Then, when the time was right, He went to the Jordan River to be baptized by John, and the Father announced that Jesus was His beloved Son. Jesus didn't rush. He waited for the moment His Father had chosen. We often want to grow up fast or do big things right away. Jesus shows us that the quiet years of learning, helping, and obeying at home are precious to God too.", "At the wedding in Cana, Mary noticed the wine had run out and told Jesus. Jesus said that His time had not yet come, but Mary trusted Him anyway and told the servants to do whatever He said. The servants filled six huge stone jars with water, which took a lot of time and work, without knowing what would happen. Then Jesus turned the water into wonderful wine. Mary and the servants were patient and trusting. Sometimes we have to do our part and wait without knowing how things will turn out. When we're patient and obedient, Jesus can do amazing things.", "When Jesus taught about God's Kingdom, He compared it to a tiny mustard seed that grows into a big plant, and to seeds that a farmer plants and waits for. A farmer can't make seeds grow faster by yelling at them! Jesus was also patient with His disciples, who often didn't understand what He was teaching. He explained things again and again without giving up on them. In our family, we're all still learning and growing. When a little brother or sister doesn't understand something, or makes the same mistake again, we can be patient with them like Jesus was with His disciples.", "On the mountain, Peter saw Jesus shining in glory with Moses and Elijah, and he wanted to stay there forever. He even offered to build tents so they could stay. But Jesus led them back down the mountain, because there was still work to do before the glory of Easter. Peter had to be patient and follow Jesus through hard days first. We all have moments we wish would last forever, and days we wish would hurry up and end. Patience means walking with Jesus through the ordinary days and the hard days too, trusting that He is leading us toward joy.", "At the Last Supper, Jesus gave us the gift of the Eucharist. Ever since then, He has waited for us in the tabernacle of every Catholic church, day and night. Jesus is so patient! He waits for us to come visit Him, to pray, and to receive Him at Mass. At Mass, we can practice patience too, by sitting still, listening, and waiting quietly. Patience is a way of showing love, because it gives others our time and attention. This week, let's practice patience by sitting still and listening during prayers and meals, and let's try to visit Jesus in the tabernacle together if we can."], "sorrowful": ["In the garden, Jesus asked His friends to stay awake and pray with Him. Three times He came back and found them sleeping. Jesus was sad, but He didn't yell at them or give up on them. He woke them gently and kept praying to His Father, accepting whatever God asked. Jesus was patient with His sleepy friends, even on the hardest night of His life. When we're tired, sad, or stressed, it's easy to snap at the people around us. Jesus shows us we can stay gentle and patient with others even when we're having a hard time ourselves.", "Jesus stood silently while the soldiers whipped Him. He didn't complain, argue, or fight back. He patiently endured the pain because He knew it would bring about our salvation. Patience isn't only waiting for good things; it also means bearing hard things without giving up. Sometimes we have to put up with things we don't like: a scraped knee, a long car ride, or a chore we don't enjoy. We can offer those little sufferings to Jesus and join them to His. When we do that with patience, even our small troubles become a gift of love to God.", "The soldiers mocked Jesus, pressed thorns into His head, and pretended to honor Him as a king. They kept teasing Him, and Jesus kept quiet. He didn't lose His temper or snap back at them. Patience helps us keep control of our tongue when others are bothering us. In a big family, someone is always going to be noisy, annoying, or in the way. When a brother or sister keeps bugging us, we can take a deep breath, ask Jesus for help, and answer gently instead of yelling. A patient answer can turn an argument into peace.", "Jesus carried His heavy cross step by step through the streets. It was a long, painful walk, and He fell more than once. But each time, He got back up and kept going. He didn't try to rush or quit; He just kept taking the next step. When something is hard, like learning math, practicing an instrument, or doing a big chore, we may want to give up. Patience means taking one step at a time and not giving up when we fall. Jesus walks with us, and He gives us the strength to take the next step.", "Jesus hung on the cross for three long hours. Even in terrible pain, He was patient and kind. He forgave His enemies, comforted the thief beside Him, and cared for His mother by giving her to John. He trusted His Father until the very end. Patience is really a kind of love: it puts others first and trusts God's plan. Jesus' patience on the cross shows us how great His love is. This week, let's each choose one thing that usually makes us impatient, like waiting for dinner or sharing the bathroom, and offer it up to Jesus with a smile instead of a complaint."], "glorious": ["After Jesus died, His friends had to wait three days, and those days were full of sadness and fear. They didn't understand yet what God was doing. Then on Easter morning, Jesus rose from the dead, and their sorrow turned to joy! God had a plan the whole time, even when it looked like everything had gone wrong. Sometimes we have to wait through sad or confusing times too. Easter reminds us that God always brings new life and joy in the end. When we're waiting for something hard to get better, we can hold on to hope, because Jesus is risen.", "When Jesus went up to Heaven, He told the apostles to wait in Jerusalem until the Holy Spirit came. They didn't know exactly when that would be, but they obeyed. Jesus also promised that He would come again in glory at the end of time. As Christians, we are waiting too, for Jesus to return and for Heaven. While we wait, we have work to do: loving God and loving each other. Being patient doesn't mean doing nothing. It means faithfully doing our part while we trust God with the rest.", "For nine days after Jesus went to Heaven, the apostles waited and prayed together with Mary. That was the very first novena! Then the Holy Spirit came down like fire and filled them with power. Patience is one of the fruits of the Holy Spirit, which means it grows in our hearts when we let the Holy Spirit work in us. We don't have to become patient all on our own. When we feel our temper rising, we can quietly pray, Come, Holy Spirit. He will help us stay calm and loving.", "Mary lived on earth for some time after Jesus went to Heaven. She missed her Son, but she patiently kept praying and helping the early Church, trusting that she would see Him again. When her life on earth was finished, God took her body and soul into Heaven, and she was with Jesus forever. Mary's whole life was full of patient trust: at the Annunciation, in Bethlehem, at the cross, and in the years after. She kept all these things in her heart and thought about them. We can ask Mary to help us be patient when we miss someone or when we're waiting for something good.", "Jesus crowned Mary Queen of Heaven and Earth. Her crown is a reward for a lifetime of patient faith, love, and trust. Mary never demanded her own way; she waited on God and said yes to His plans. God promises a crown of glory to everyone who stays faithful to Him. Every little act of patience is like a jewel we offer to God, and Mary, our Queen and Mother, is ready to help us. This week, let's each pick one person in our family we often get impatient with, ask Mary to help us, and practice speaking to that person gently every day."]}},
  {id:"kindness", name:"Kindness", draft:true, med:{"joyful": ["When the angel Gabriel appeared to Mary, she was troubled at first. Gabriel spoke to her gently and told her not to be afraid, because God was pleased with her. God could have sent His Son in many ways, but He chose to ask a humble young woman gently, and He waited for her answer. God's messages always come with kindness. Kindness means speaking gently, especially when someone is scared or upset. When a little brother or sister is afraid of the dark or nervous about something new, we can be like Gabriel and speak calm, kind words. God uses our kindness to bring His peace.", "As soon as Mary heard that her older cousin Elizabeth was expecting a baby, she set out on a long journey through the hills to help her. When Elizabeth saw Mary, she was filled with joy, and baby John leaped inside her. Mary's kindness was practical: she helped Elizabeth with the work of the house and getting ready for the baby. Kindness isn't just nice feelings; it shows up in what we do. We can be kind by helping Mom carry groceries, setting the table, or playing with a younger sibling. Little acts of kindness bring joy, just like Mary's visit did.", "After Jesus was born, poor shepherds came to the stable to see Him. They were rough from working outside with sheep, and many people looked down on them. But they were welcomed to see the newborn King. Later, wise men came from far away, and they were welcomed too. Jesus' family was kind to everyone, no matter who they were. Sometimes we're kind only to people we like or who are like us. Jesus wants us to be kind to everyone, especially people others ignore or treat badly.", "When Mary and Joseph brought Jesus to the Temple, they were poor, so they offered two small birds instead of a lamb. God doesn't care how big our gifts are; He cares about our love. In the Temple, old Simeon came up to them, and Mary let him hold her precious baby. Simeon was so happy that he praised God. A small act of kindness can make someone's whole day. Holding a door, sharing a smile, or letting someone have a turn with something special can bring great joy. Let's look for little ways to be kind to the older people we meet.", "When Mary and Joseph finally found Jesus in the Temple, He was sitting with the teachers, listening and asking questions. Jesus listened respectfully to the older teachers, and when His parents came, Mary spoke to Him gently, even though she had been very worried. Kindness includes the way we listen and the way we speak, especially when we're upset. Then Jesus went home with His family and grew in wisdom and in favor with God and with people. Kind hearts grow when we practice kindness every day. This week, let's each do one secret act of kindness every day for someone in our family, without telling anyone it was us."], "luminous": ["Jesus walked to the Jordan River and stood in line with ordinary people to be baptized by John. He didn't ask for special treatment, even though He is the Son of God. John felt he wasn't worthy to baptize Jesus, but Jesus kindly asked him to go ahead, treating John with honor. Then the Holy Spirit came down like a gentle dove. A dove is a sign of peace and gentleness, and the Holy Spirit helps us be gentle and kind too. When we treat others with respect and don't act like we're better than anyone, we're following Jesus.", "At the wedding in Cana, Mary noticed that the hosts had run out of wine, and she didn't want the young couple to be embarrassed. She quietly asked Jesus to help, and He turned water into the best wine of the whole party. Most guests never even knew there had been a problem! Jesus and Mary were kind in a quiet way that protected the couple's feelings. Kindness pays attention to how others feel. We can be kind by not pointing out other people's mistakes in front of everyone and by quietly helping instead. Real kindness doesn't need to be noticed.", "Jesus spent His days being kind to people who needed Him. He touched people with leprosy when everyone else stayed away. He welcomed little children when the disciples tried to send them away. He noticed a poor widow giving her last coins, and a short man named Zacchaeus up in a tree. Jesus never thought anyone was too small or unimportant for His attention. He taught us to treat others the way we want to be treated. In our home, we can be kind like Jesus by noticing who needs attention and making them feel loved.", "On the mountain, Peter, James, and John saw Jesus shining with heavenly light, and they heard the Father's voice. They were so frightened that they fell to the ground. Jesus came over, touched them gently, and told them to get up and not be afraid. Even in His glory, Jesus was kind and gentle with His friends. Jesus is the most powerful person who ever lived, and He is also the kindest. Being strong and being kind go together. When we're bigger or stronger than someone, we should use that to help and protect them, never to scare them.", "At the Last Supper, Jesus got down on His knees and washed His disciples' dusty feet. That was a job for the lowest servant, but Jesus did it out of love. Then He gave them the greatest gift of all, His own Body and Blood in the Eucharist. Jesus told them to serve one another the way He had served them. Kindness often means doing humble, unseen jobs for others. Every time we receive Jesus, He fills us with His kindness so we can share it. This week, let's each serve someone in our family the way Jesus did, by helping with a job they don't like, such as putting away their laundry, wiping the table, or picking up their toys."], "sorrowful": ["In the garden, Jesus felt great sadness, and He asked His friends to stay with Him and pray. When soldiers came to arrest Him, Peter cut off a servant's ear with a sword. Jesus told Peter to stop, and then He touched the man's ear and healed him. Even while He was being arrested, Jesus was kind to someone who had come to take Him away. Kindness isn't only for people who are nice to us. Jesus shows us how to be kind even to people who are unkind to us. That is the hardest kindness, and the most like Jesus.", "The soldiers who whipped Jesus were cruel, and they hurt Him badly. Jesus endured it without saying unkind things in return. Jesus knows how much unkindness hurts. When we're unkind with our hands or our words, we hurt the people God loves. When we're kind, we help heal the hurt that sin has caused in the world. Every kind word is like a bandage on someone's heart. Let's ask Jesus to help us use our hands for helping and our words for healing.", "The soldiers laughed at Jesus, put a crown of thorns on His head, and mocked Him. Nobody stood up for Him. Jesus knows what it feels like to be made fun of and left alone. In our family and with our friends, we can be the ones who stand up for someone who is being teased. We can sit with the kid who's alone or say something kind to someone who's being laughed at. That's what Jesus would do, and that's what He hopes we'll do. Kindness sometimes takes courage.", "As Jesus carried His heavy cross, a woman named Veronica pushed through the crowd and gently wiped His face. It was a small act, but it took courage, and it comforted Jesus. A man named Simon also helped carry His cross. Jesus taught that whatever we do for the least of our brothers and sisters, we do for Him. Every time we're kind to someone who is struggling, we're like Veronica wiping Jesus' face. A tissue for a crying sibling or a glass of water for a tired parent can be just as loving. Let's keep our eyes open for people who need a little comfort.", "Even while Jesus was dying on the cross, He was thinking of others. He forgave the people who crucified Him, comforted the thief beside Him, and made sure His mother would be cared for by John. Jesus' last moments were full of kindness. He gave everything He had, His whole life, out of love for us. When we're tired, hurting, or upset, it's hard to think of others, but Jesus shows us that kindness is possible even in our hardest moments. This week, let's each make a card or note for someone outside our family, like a neighbor, a grandparent, or someone who is sick or lonely, and deliver it together."], "glorious": ["On Easter morning, Mary Magdalene was crying at the empty tomb because she thought someone had taken Jesus' body. Jesus came to her and gently called her by name. Instantly, her tears turned to joy! Jesus could have appeared first to powerful people, but He went to someone who was sad and needed comfort. Calling someone by name with love is a beautiful kindness. When someone is sad, we can go to them, say their name gently, and help them feel loved. Jesus is risen, and His kindness never ends.", "Before He went up to Heaven, Jesus lifted His hands and blessed His friends. His last act on earth was a blessing! Jesus promised that He would not leave us alone and that He was going to prepare a place for us. Now He asks us to keep doing the kind things He did. We are His hands and feet in the world. When we bless others with kind words and kind deeds, we continue Jesus' work. We can even bless each other at bedtime by making a little cross on each other's foreheads.", "When the Holy Spirit came at Pentecost, the apostles were filled with love and went out to share the good news. Soon the first Christians were sharing everything they had, so that no one among them was in need. People noticed how kindly the Christians treated each other, and many more joined the Church. Kindness is one of the fruits of the Holy Spirit. When we're kind, we show people what God is like. Others may come to know Jesus just by seeing how we treat each other. Let's ask the Holy Spirit to make our home a place full of kindness.", "Mary was taken body and soul into Heaven, but she didn't forget about us. All through history, Mary has come to help her children. When she appeared to Juan Diego as Our Lady of Guadalupe, she spoke to him tenderly, like a loving mother, and told him not to be troubled, because she was his mother. Mary's kindness is gentle and tender, and she cares about our smallest worries. We can talk to Mary about anything. And we can treat others with the same tenderness she shows us. Let's ask Mary to make our words as gentle as hers.", "Jesus crowned His mother Mary Queen of Heaven and Earth. Mary is a queen of kindness and mercy. She doesn't rule by bossing people around, but by loving and caring for each of her children. In God's Kingdom, the kind and humble are the greatest. Every time we choose kindness, we are acting like true sons and daughters of our Queen. This week, let's each choose one kind thing to do for a neighbor, like bringing them cookies, raking leaves, shoveling a walk, or just stopping to say hello and ask how they are."]}},
  {id:"forgiveness", name:"Forgiveness", draft:true, med:{
    joyful:[
      "God sent the angel Gabriel to Mary because He had a plan to forgive the whole world. Ever since Adam and Eve disobeyed, sin had separated people from God. But God never stopped loving His children. He sent His own Son to be born of Mary so that our sins could be forgiven. When Mary said yes, God's great plan of mercy began. God doesn't wait for us to be perfect before He loves us; He comes to us first. When someone in our family hurts us, we can be like God and be the first to reach out with love.",
      "When Mary visited her cousin Elizabeth, Elizabeth's husband Zechariah could not speak. He had doubted the angel's message, so God had made him unable to talk until his son was born. When baby John arrived, Zechariah trusted God and named him John, and his voice came back. He praised God, and his son grew up to prepare people's hearts to be forgiven. Zechariah made a mistake, but God gave him a second chance. Everyone in our family makes mistakes too. When someone says sorry, we can give them a second chance, just like God does.",
      "Jesus came into the world as a tiny baby, born in a stable in Bethlehem. The angels told the shepherds that a Savior had been born. A Savior is someone who rescues us, and Jesus came to rescue us from sin. His very name means God saves. A baby is easy to love and easy to come close to, and God came that way so no one would be afraid to come to Him. When we make mistakes, we never need to hide from Jesus. We can run to Him, say sorry, and know He will forgive us.",
      "Mary and Joseph brought baby Jesus to the Temple to offer Him to God. There, an old man named Simeon told Mary that a sword of sorrow would pierce her heart, because Jesus would suffer for us. Mary knew that loving Jesus would bring sorrow, and she trusted God anyway. Years later, she stood by the cross while Jesus prayed for the people who were hurting Him. Forgiving can hurt, especially when someone has hurt us a lot. But Mary shows us that a loving heart can stay close to God even when it's hard. When forgiving feels too hard, we can ask Mary to help us.",
      "Jesus stayed behind in Jerusalem, and Mary and Joseph searched for Him for three days. When they found Him in the Temple, Mary told Him how worried they had been. Jesus hadn't done anything wrong, but His parents didn't understand at first, and they talked it through together with patience and love. Then Jesus went home with them and obeyed them, and the family stayed close. Even in a holy family, people can feel worried or confused. What matters is that we talk, listen, and stay close. This week, when someone in our family hurts us, let's practice saying I forgive you right away, and when we hurt someone, let's say I'm sorry and ask how we can make it right."
    ],
    luminous:[
      "Crowds came to John the Baptist at the Jordan River to say they were sorry for their sins and be washed in the water. Jesus came too, even though He had no sins. He stood in line with sinners to show that He came to save them. At our own baptism, God washed away original sin and made us His children. And when we sin after baptism, Jesus gives us Confession, where we can be forgiven again and again. God never gets tired of forgiving us. Since God forgives us so many times, we can keep forgiving each other too.",
      "At a wedding in Cana, the wine ran out, and the new couple was about to be embarrassed. Mary noticed and asked Jesus to help, and He turned water into wonderful wine. Jesus didn't scold anyone for planning badly. He simply fixed the problem with kindness and made the celebration even better. That's how Jesus treats our mistakes too: when we bring them to Him, He doesn't shame us; He brings something good out of them. In our family, we can treat each other's mistakes the same way. When someone spills, breaks, or forgets something, we can help fix it instead of making them feel bad.",
      "Jesus traveled everywhere telling people that the Kingdom of God was near and inviting them to turn away from sin. He forgave a paralyzed man's sins and then healed him so he could walk. He told the story of the prodigal son, whose father ran to hug him when he came home after wasting everything. When Peter asked how many times he should forgive, Jesus taught him to forgive over and over, without counting. In the Our Father, we ask God to forgive us as we forgive others. That's a big promise to make every day! Let's ask Jesus to help us keep it in our home.",
      "On a high mountain, Jesus shone with glory as bright as the sun, and Peter, James, and John saw Him talking with Moses and Elijah. Peter was there, the same Peter who would later say three times that he didn't know Jesus. Jesus already knew Peter would fail Him, but He brought him up the mountain anyway and showed him His glory. Jesus sees what we can become, not just the mistakes we make. When we forgive someone, we choose to see them the way Jesus does: as someone God is still making beautiful. So let's not hold on to old mistakes or keep reminding each other of them.",
      "At the Last Supper, Jesus gave His apostles His Body and Blood. He knew Judas would betray Him and the others would run away that very night, yet He still washed their feet and shared this meal with them. Jesus told them His Blood would be poured out so that sins could be forgiven. Every Mass is a gift of forgiveness and love, and at the start of Mass we tell God we are sorry. Before we receive Jesus, we offer each other a sign of peace. This week, let's make peace before we go to bed each night: if anyone in our family is upset with someone, let's say sorry, forgive, and give a hug before the day ends."
    ],
    sorrowful:[
      "In the garden, Jesus prayed so hard that His sweat became like drops of blood. He was carrying the weight of every sin, including ours. Then Judas came with soldiers and betrayed Jesus with a kiss. When Peter struck a servant with a sword and cut off his ear, Jesus told Peter to put the sword away, and He healed the man's ear. Jesus answered hate with healing. When someone is mean to us, we might want to strike back. Jesus shows us we can choose peace instead, and even do something kind for the person who hurt us.",
      "Soldiers whipped Jesus, even though He had done nothing wrong. Jesus suffered for our sins so that we could be forgiven. That shows how serious sin is, and how much greater God's love is. Jesus forgave us so much more than anyone could ever owe us. When we remember that, it becomes easier to forgive the small things others do to us. A brother or sister who took our toy or said something unkind has done something small compared to all that Jesus has forgiven us. Let's remember His love whenever we feel like holding a grudge.",
      "Soldiers pressed a crown of thorns onto Jesus' head, mocked Him, and spit on Him. Jesus is the true King, and He could have stopped them at any moment. Instead, He stayed silent and kept loving them. Being teased and laughed at hurts deeply, and it can make us want to get even. Jesus shows us that forgiving isn't pretending we weren't hurt. It means giving the hurt to God and deciding not to pay the other person back. When we've been teased, we can tell Jesus about it, and He will help our hearts heal.",
      "Jesus carried His heavy cross through the crowded streets. Some people shouted at Him, and others just watched. He fell under the weight, but He got back up and kept going. Simon of Cyrene helped Him, and the women of Jerusalem wept for Him. Through all of it, Jesus never complained or blamed anyone. Sometimes saying sorry or forgiving feels like carrying something heavy. It's hard to go first, and sometimes we fall and need to try again. Like Jesus, we can keep getting back up and keep choosing to forgive.",
      "Hanging on the cross, Jesus prayed for the very people who crucified Him, asking His Father to forgive them because they didn't know what they were doing. A thief beside Him said he was sorry, and Jesus promised him Paradise that same day. Even at the very end, Jesus was forgiving. No sin is too big for God's mercy when we are truly sorry. Jesus wants our family to be a place where forgiveness happens quickly and fully. This week, let's each think of someone we are still upset with, pray for them by name, and tell them we forgive them, or say sorry if we were the one who hurt them."
    ],
    glorious:[
      "When Jesus rose from the dead, He came back to the same friends who had abandoned Him. He didn't come with anger or punishment. He greeted them with peace and showed them His wounds. Then He gave the apostles the power to forgive sins in His name, which is why priests can forgive our sins in Confession today. Later, Jesus asked Peter three times if he loved Him, once for each time Peter had denied Him, and gave him a fresh start. Jesus doesn't keep score of our failures. When we forgive, we can stop keeping score too and let each other start fresh.",
      "Before Jesus went up to Heaven, He told the apostles to bring the good news of forgiveness to every nation. Forgiveness was the message He wanted the whole world to hear. Then He blessed them and rose into Heaven, where He is preparing a place for us. Heaven is a place of perfect peace, with no grudges and no hurt feelings. Every time we forgive, we bring a little bit of Heaven into our home. Jesus is waiting for us there, and He wants us to arrive together as a family.",
      "The Holy Spirit came upon the apostles like tongues of fire. Peter, who had once denied Jesus out of fear, stood up bravely and told the crowd all about Jesus. He told them to turn away from their sins and be baptized so their sins could be forgiven, and about three thousand people were baptized that day! The Holy Spirit gives us the strength to do what we can't do alone. Sometimes we're too proud to say sorry, or too hurt to forgive. That's exactly when we can ask the Holy Spirit to fill our hearts and give us courage.",
      "When Mary's life on earth was finished, God took her body and soul into Heaven. Mary never sinned, yet in the Hail, Holy Queen we call her the Mother of mercy. She loves sinners and prays for them constantly. In the Hail Mary, we ask her to pray for us sinners, now and at the hour of our death. Mary never gets tired of hearing from us or helping us come back to God. She shows us that the holiest heart is also the most merciful one. When we're tempted to look down on someone who did wrong, we can remember how gently Mary treats us.",
      "Jesus crowned His mother Queen of Heaven and Earth. In the Hail, Holy Queen, we call her our advocate, which means someone who speaks up for us. A queen full of mercy doesn't punish or hold grudges; she pleads for her children. Mary asks Jesus to help us when we fail, and she wants us to treat each other with that same mercy. Our family can be a little kingdom of mercy, where mistakes are forgiven and no one is shamed. This week, let's go to Confession as a family if we can, and each night before bed, let's think about our day, tell God we're sorry for anything we did wrong, and forgive anyone who hurt us."
    ]
  }},
  {id:"obedience", name:"Obeying Our Parents", draft:true, med:{"joyful": ["When the angel Gabriel told Mary God's plan, Mary said yes. She called herself the servant of the Lord and agreed to do whatever God asked. Mary didn't understand everything, but she trusted that God's plan was good. That is what obedience really is: saying yes to God because we trust that He loves us. God often speaks to children through their parents. When Mom or Dad asks us to do something, we can answer like Mary did, with a cheerful yes. Our obedience makes room for God to do great things.", "Elizabeth and her husband Zechariah were good people who followed God's commandments. When their son was born, they obeyed what the angel had told them and named him John, even though the neighbors expected a family name. Mary also obeyed God and carried Jesus to Elizabeth's home. Both families honored God by listening and obeying. Sometimes doing what is right isn't what others expect. We may be the only ones obeying while friends are doing something else. God blesses us when we choose to obey Him and our parents, even when it isn't popular.", "Mary and Joseph traveled to Bethlehem because the emperor ordered everyone to be counted in their family's hometown. It was a long, hard trip, especially for Mary, who was about to have a baby. But they obeyed, and that is how Jesus came to be born in Bethlehem, just as the prophets had foretold. God used their obedience to keep His promise. Sometimes we don't understand why we have to follow a rule. But obeying those in charge, like our parents and teachers, can be part of God's bigger plan for us. When we obey with a good attitude, we let God work through us.", "Forty days after Jesus was born, Mary and Joseph took Him to the Temple, just as God's law asked families to do with their firstborn son. They traveled to Jerusalem and offered a sacrifice. Mary and Joseph obeyed God's law carefully, even in small details. Because they were faithful, they met Simeon and Anna, who recognized Jesus as the Savior. Obedience in small things matters. When we make our bed, brush our teeth, and finish our schoolwork without being reminded, we're being faithful in little things. God sees our small acts of obedience and is pleased.", "When Jesus was twelve, Mary and Joseph found Him in the Temple after searching for three days. Jesus is the Son of God, wiser than any teacher, yet He went home to Nazareth and obeyed Mary and Joseph. For many years, He helped Joseph in the carpenter shop and helped His mother at home. If Jesus, who is God, obeyed His parents, we can do it too. The Fourth Commandment asks us to honor our father and mother. This week, let's practice first-time obedience: when Mom or Dad asks us to do something, let's say yes and do it right away, without arguing or complaining."], "luminous": ["Jesus went to the Jordan River to be baptized by John. John didn't think he should baptize Jesus, but Jesus explained that it was right, because it was what God wanted. Then the heavens opened, and the Father said He was pleased with His beloved Son. Jesus' whole life was about obeying His Father in Heaven. When we obey God, our Father in Heaven is pleased with us too. At our baptism, we became children of God. Children of God show their love by listening and obeying.", "At the wedding in Cana, Mary told the servants to do whatever Jesus told them. Jesus asked them to fill six large jars with water, which seemed like a strange request when what they needed was wine. But the servants obeyed without arguing. Because they obeyed, they got to see Jesus' very first miracle! Mary's advice to the servants is good advice for us too: do whatever Jesus tells you. Sometimes what our parents or God ask doesn't make sense to us right away. When we obey anyway, we often get to see something wonderful happen.", "Jesus taught that the people who truly love Him are the ones who hear God's word and keep it. He told a story about a wise man who built his house on rock and a foolish man who built on sand. When the storm came, the house on the rock stood strong. Obeying God is like building our lives on rock. Jesus also told a story about two sons: one said no to his father but then went and obeyed, and the other said yes but never went. Jesus wants our yes to be real. When we say we'll do something, let's actually do it.", "On the mountain, Peter, James, and John saw Jesus shining in glory. Then a cloud covered them, and the Father's voice told them that Jesus was His beloved Son and that they should listen to Him. Listening is the first part of obeying. We can't obey if we don't really hear what's being asked. Sometimes we're too busy, distracted, or stubborn to listen to God or to our parents. The Father's message is for us too: listen to Jesus. When we listen carefully, we can obey well.", "On the night before He died, Jesus washed His disciples' feet and gave them His Body and Blood in the Eucharist. He told them to do this in memory of Him, and the Church has obeyed that command ever since. Every Mass happens because the apostles and priests obeyed Jesus. Jesus also told His disciples that if they loved Him, they would keep His commandments. Obedience is how we show love. This week, let's make a family chart of jobs, and let's each try to do our jobs cheerfully every day without being reminded."], "sorrowful": ["In the Garden of Gethsemane, Jesus knew how much He was about to suffer, and He felt afraid. He prayed and asked His Father if there was any other way. But then He told His Father that He wanted the Father's will to be done, not His own. That was the hardest act of obedience ever, and Jesus did it out of love for us. Sometimes we don't want to obey, because what we're asked to do is hard or unpleasant. Like Jesus, we can tell God how we feel, and then choose to obey anyway. Obedience doesn't mean we never struggle; it means we trust God and our parents more than our feelings.", "Jesus was arrested and whipped, though He had done nothing wrong. He could have called armies of angels to rescue Him, but He obeyed His Father's plan. His obedience was not weakness; it was strength and love. Jesus obeyed all the way, even when it hurt. Our disobedience can hurt others and ourselves, but Jesus' obedience brought healing to the whole world. When we're tempted to disobey, let's remember how much Jesus' obedience cost Him. We can offer our small acts of obedience to comfort His heart.", "The soldiers mocked Jesus as a king. Jesus really is the King, but He came to serve and obey, not to be served. Pride makes us want to be the boss and do things our own way. When we argue with our parents, roll our eyes, or say we know better, that is pride. Jesus, the true King, shows us a different way: humility. Honoring our parents means speaking to them with respect, even when we disagree. Let's ask Jesus for a humble heart.", "Jesus carried His cross all the way to Calvary because it was His Father's will. He kept going step by step, even when He fell. He didn't stop halfway or take a shortcut. Obedience means finishing what we're asked to do, not just starting it. When we're asked to clean our room, obedience means cleaning the whole room, not just shoving things under the bed! Jesus gives us strength to finish well. Let's offer our hard jobs to Him and carry them all the way to the end.", "On the cross, Jesus finished the work His Father had given Him. He was obedient all the way to death on a cross. Even while dying, He honored His mother by making sure John would take care of her. Jesus perfectly obeyed His Father in Heaven and perfectly honored His mother on earth. His obedience opened Heaven for us. This week, let's honor Mom and Dad in a special way: each of us can thank them for something specific they do for our family, and do one thing to help them without being asked."], "glorious": ["Because Jesus obeyed His Father all the way to the cross, God raised Him from the dead on Easter morning. His obedience led to new life and glory! On Easter, the women went to the tomb, and an angel told them to go tell the disciples that Jesus was risen. They obeyed right away and ran with great joy. When we obey quickly and joyfully, like those women, we share in Jesus' Easter joy. Obedience isn't a heavy burden; it leads to life. God always blesses those who trust and obey Him.", "Before Jesus went up to Heaven, He gave His apostles a mission: go and make disciples of all nations, baptizing them and teaching them to obey everything He had commanded. He also told them to wait in Jerusalem for the Holy Spirit. The apostles obeyed both commands. They waited and prayed, and then they went out to the whole world. Because of their obedience, the faith was passed down for two thousand years, all the way to our family. When we learn our faith and obey God's commandments, we keep that chain going for the next generation.", "When the Holy Spirit came, the apostles were filled with courage. Later, when leaders ordered them to stop preaching about Jesus, Peter answered that they must obey God rather than people. Our first obedience always belongs to God. We obey our parents because God asks us to, and because good parents lead us toward God. The Holy Spirit gives us the strength to choose what's right, even when others pressure us to do wrong. Let's ask the Holy Spirit for courage to always obey God first. With His help, we can be brave and faithful.", "When Mary's life on earth was over, God took her body and soul into Heaven. Mary's whole life was one long yes to God, from the Annunciation to the foot of the cross. After Jesus, no one has ever obeyed God more perfectly. God honored her obedience by bringing her to Heaven in a special way. God promises to bless those who obey Him and honor their parents. When we follow Mary's example, we are walking the path to Heaven too. We can ask Mary to help us say yes to God every day.", "Jesus crowned His mother Queen of Heaven and Earth, giving her great honor. Jesus kept the Fourth Commandment perfectly: He honored His mother on earth, and He honors her forever in Heaven. When we honor Mary, we are imitating Jesus. And when we honor our own mothers and fathers, we are imitating Him too. Honoring parents means obeying them, respecting them, and caring for them, even when we're grown up. This week, let's surprise Mom and Dad with a special act of honor, like helping make them breakfast, writing them a letter, or praying a decade of the rosary just for them."]}},
