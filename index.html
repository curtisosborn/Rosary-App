  {id:"sharing", name:"Generosity", draft:true, med:{"joyful": ["God gave the greatest gift of all when He sent His only Son to be born of Mary. God didn't keep His Son to Himself; He shared Him with the whole world. Mary was generous too. When the angel asked her to be the Mother of Jesus, she gave her whole life to God without holding anything back. Generosity starts with knowing that everything we have is a gift from God. Our toys, our home, our food, and even our family are gifts. When we remember that, it becomes easier to share what we've been given.", "Mary heard that her cousin Elizabeth was expecting a baby, and she went right away to help. She shared her time, her energy, and her love for three whole months. And she brought along the best gift of all: Jesus, growing inside her. Sharing isn't only about things. We can share our time by playing with a younger sibling, our energy by helping with chores, and our love by listening. The best thing we can share is Jesus, by being joyful and kind. Let's be generous with our time like Mary was.", "When Jesus was born, the shepherds came to see Him, and then they went and told everyone the good news. Later, wise men traveled from far away and brought gifts of gold, frankincense, and myrrh. They gave their best to the newborn King. When we give gifts to Jesus, we can give our best too: our best effort, our best attitude, and our best things. Sometimes we want to share only what we don't care about anymore. Generosity means sometimes giving away something we really like. Jesus gave us Himself, so we can give Him our best.", "When Mary and Joseph presented Jesus in the Temple, they offered two small birds, the offering of a poor family. They didn't have much, but they gave what they could. Later, Jesus praised a poor widow who put two tiny coins into the Temple offering, because she gave all she had. God doesn't measure our gifts by how big they are, but by how much love is in them. Even little children who don't have money can be generous. We can share a snack, give a hug, or offer our place in line. Every gift given with love is precious to God.", "When Jesus was twelve, He stayed in the Temple, His Father's house, sharing His wisdom with the teachers there. Everyone who heard Him was amazed. Then He went home with Mary and Joseph and shared His life with them in their humble home in Nazareth. Jesus shared His time, His work, and His love with His family every day for many years. Our family is the first place we learn to share. This week, let's each choose one thing we really like and share it with a brother or sister for a whole day, and let's look for one thing we can give to someone in need."], "luminous": ["When Jesus was baptized, the heavens opened and the Holy Spirit came down. At our own baptism, God generously gave us His grace, His life, and His Holy Spirit. We didn't earn it or pay for it; it was a free gift. John the Baptist taught people to be generous too. He told them that whoever had two coats should share with someone who had none, and whoever had food should do the same. When we receive so much from God, we want to share with others. Let's look at what we have and ask how we can share it.", "At the wedding in Cana, Jesus turned water into wine, and not just a little wine. He filled six large jars, more than enough for the whole party, and it was the very best wine! God is generous beyond what we can imagine. He doesn't give us just barely enough; He gives abundantly. When we share, we can be generous like Jesus, giving more than the bare minimum. If a sibling asks for some of our candy, we can give them a good piece, not the smallest one. Generous hearts make God smile.", "Once, a huge crowd followed Jesus to hear Him teach, and they got hungry. A boy shared his five loaves and two fish, and Jesus used them to feed more than five thousand people! There were even twelve baskets of leftovers. That boy didn't have much, but when he gave it to Jesus, it became a miracle. Jesus taught that it is more blessed to give than to receive. When we share even a little, Jesus can multiply it into something great. Let's never think our small gifts don't matter.", "On the mountain, Jesus shared His glory with Peter, James, and John. For a moment, they got to see how wonderful He truly is. Jesus didn't keep His glory hidden from His closest friends; He shared it to strengthen them for the hard days ahead. Jesus wants to share His glory with all of us in Heaven someday. Sharing good things makes them even better. When something exciting happens, we can share our joy. When someone else gets something good, we can be happy for them instead of jealous.", "At the Last Supper, Jesus took bread and wine and gave His apostles His own Body and Blood. He gave them not just something He had, but Himself. Every time we go to Mass, Jesus gives Himself to us completely in Holy Communion. There is no gift more generous than that. When we receive so much, our hearts should become generous too. This week, let's each set aside some of our own money or a favorite item to give to people in need, and let's bring it together as a family to church or to a food shelf."], "sorrowful": ["In the garden, Jesus offered Himself completely to His Father's will. He gave up His own comfort and His own wishes for our sake. Generosity sometimes means giving up what we want so someone else can have what they need. It might mean giving up the last cookie, the front seat, or the toy we wanted to play with. That can feel hard, like a little sacrifice. But every time we give generously, we become more like Jesus, who gave up everything for us. Let's ask Jesus to make our hearts generous.", "Jesus suffered terribly when the soldiers whipped Him, and He accepted that suffering for us. He didn't hold anything back; He gave His body for our salvation. Jesus' love is not stingy or careful; it is completely generous. Selfishness wants to keep everything for ourselves. Generosity remembers that what we have is a gift from God, meant to be shared. When we're tempted to be selfish, let's remember how freely Jesus gave Himself for us. A generous heart is a heart that looks like His.", "The soldiers dressed Jesus in a purple robe and gave Him a crown of thorns, mocking Him as a king. Jesus, the King of all creation, had given up everything for our sake. The world tells us that being important means having lots of stuff and being in charge. Jesus shows us that real greatness comes from giving, not taking. A generous heart doesn't need the best toys or the biggest piece to be happy. Real joy comes from loving and giving, not from having more. Let's be happy with what we have and generous with others.", "Simon of Cyrene was walking along when the soldiers made him help Jesus carry His cross. He didn't plan to help that day, but he shared Jesus' heavy load. Sometimes generosity means sharing someone else's burden, even when it interrupts our plans. When a parent is busy with the baby, or a sibling is struggling, we can step in and help. We can share our strength, our time, and our attention. Simon probably never forgot that he helped carry the cross of Jesus. Helping carry each other's crosses is one of the most generous things we can do.", "On the cross, Jesus gave everything: His body, His blood, His life, and even His own mother, whom He gave to us. He held nothing back. This is the most generous love the world has ever seen. Jesus gave His life so that we could have eternal life, and when we look at a crucifix, we see how much we are loved. Generosity is our way of loving Jesus back. This week, let's go through our toys and clothes together and choose some good ones, not just the old ones, to give to children who need them."], "glorious": ["When Jesus rose from the dead, He shared His joy and His peace with His friends. He didn't keep the good news to Himself. He appeared to Mary Magdalene, to the apostles, and to many others. Then He sent them out to share the good news with everyone. The joy of Easter is meant to be shared! When something good happens to us, we can share our happiness. And the best news we have to share is that Jesus is alive and loves everyone.", "Before Jesus went up to Heaven, He gave His apostles everything they needed to continue His work. He shared His mission with them and promised to send the Holy Spirit. Jesus trusted them with the most important job in the world. Generous people share responsibility and trust others. Older siblings can be generous by teaching younger ones how to do things, even if it's slower than doing it themselves. Sharing what we know is a wonderful gift. Let's help each other grow, like Jesus helped His apostles.", "When the Holy Spirit came at Pentecost, the first Christians became amazingly generous. They shared everything they had, and some even sold their land and houses to give to anyone in need. Nobody among them went without what they needed. The Holy Spirit fills our hearts with love, and love always wants to share. People noticed the early Christians because of how much they shared and cared for each other. Our family can show people what God's love looks like by being generous too. Let's ask the Holy Spirit to make our hearts open and giving.", "When Mary's life on earth ended, God took her body and soul into Heaven. Mary's whole life was a gift: she gave her yes to God, she gave Jesus to the world, and she gave her heart to every person. Even now, in Heaven, Mary keeps giving. She prays for us, helps us, and leads us to Jesus. A generous person's love keeps going and going. When we give our love freely, we become more like our heavenly Mother. We can ask Mary to make our hearts generous like hers.", "Jesus crowned His mother Queen of Heaven and Earth. Mary's crown is not a reward for being rich or powerful, but for loving and giving generously all her life. In God's Kingdom, the people who give the most are the greatest. Mary shares her treasures with us: her prayers, her love, and her Son. We are rich in God's eyes when we share what we have. This week, let's each pick a neighbor or friend and share something we made, like baked goods, a drawing, or flowers from the garden, to show them God's generous love."]}},
  {id:"honesty", name:"Honesty", draft:true, med:{"joyful": ["When the angel Gabriel told Mary she would be the mother of Jesus, Mary didn't pretend she understood everything. She honestly asked the angel how this could happen. Gabriel explained that the Holy Spirit would come upon her, and Mary trusted God's answer. Mary's question wasn't doubt; it was honest trust. God wants us to be honest with Him too, about what we understand and what we don't. We never have to pretend with God. When we tell God and our parents the truth about our questions and feelings, we build trust.", "When Mary arrived at her cousin's house, Elizabeth spoke the truth that the Holy Spirit showed her: Mary was blessed, and the baby she carried was the Lord. Mary answered with a beautiful prayer of praise, telling the truth about how great God is and how He lifts up the humble. Both women spoke honestly about God's work. Honest words build each other up. When we tell the truth about the good things we see in others, it encourages them. Let's speak true and good words about God and about each other.", "When Jesus was born, the angels told the shepherds the truth: a Savior had been born in Bethlehem. The shepherds went and found everything just as the angels had said. Then they told others exactly what they had seen and heard. The shepherds were honest witnesses. Jesus later taught that He Himself is the Truth. Being honest means telling things the way they really happened, without adding to them or leaving out the parts that make us look bad. When we tell the truth, we honor Jesus.", "In the Temple, Simeon told Mary the truth about what would happen. He said that Jesus would bring salvation, but that a sword of sorrow would also pierce her heart. That was hard to hear, but Simeon was honest, and Mary treasured his words. Sometimes the truth is hard to say and hard to hear. But honest words, spoken with love, help us prepare and grow. When we need to tell someone a hard truth, we can say it gently and kindly. And when someone tells us a hard truth, we can listen with humble hearts.", "When Mary and Joseph found Jesus in the Temple, Mary honestly told Him how worried they had been. Jesus honestly explained that He needed to be in His Father's house. There were no secrets or lies between them, only honest words, and then the family went home together in peace. Families stay close when we tell each other the truth. When we've made a mistake, it's tempting to hide it or blame someone else. This week, let's practice telling the truth right away whenever we make a mistake, and let's thank each other whenever someone is brave enough to be honest."], "luminous": ["John the Baptist was known for telling the truth, even when people didn't want to hear it. When people asked if he was the Messiah, he honestly said no and told them someone greater was coming. When Jesus came to be baptized, John pointed to Him and told everyone that Jesus was the Lamb of God. John didn't try to take credit or make himself look important. Honesty sometimes means admitting that someone else is better at something or deserves the credit. When we're honest and humble, we point others to Jesus, just like John did. Let's give others the credit they deserve.", "At the wedding in Cana, when the wine ran out, Mary didn't hide the problem or pretend everything was fine. She told Jesus honestly what was wrong. Then Jesus fixed it with His first miracle. When we have a problem or make a mess, the best thing to do is tell the truth about it. Hiding problems usually makes them worse. When we're honest with our parents and with Jesus, they can help us. Let's never be afraid to say that we need help or that something went wrong.", "Jesus taught that our yes should mean yes and our no should mean no. In other words, people should be able to trust what we say without us having to make big promises. He also taught that the truth will set us free. Lies make us feel trapped and worried, because we have to keep remembering what we said. The truth lets us live in peace. Jesus praised a man named Nathanael because there was nothing false in him. Let's be people others can always trust.", "On the mountain, Jesus showed Peter, James, and John who He truly is: the glorious Son of God. Jesus never pretends to be something He isn't. He is always truthful about who He is. Sometimes we're tempted to pretend we're better than we are, or to brag about things that aren't quite true. Honesty means being real and showing people who we truly are. We don't have to pretend in order to be loved, because God loves us just as we are. Let's be real with each other and with God.", "At the Last Supper, Jesus took bread and said it was His Body, and He took wine and said it was His Blood. Because Jesus always tells the truth, we believe that the Eucharist truly is Jesus, even though it still looks like bread and wine. Jesus' words can always be trusted. When people learn they can trust our words, our relationships grow stronger. Every lie, even a small one, damages trust. This week, let's be a no-fibs family: let's each tell the truth even about small things, and if we slip, let's fix it right away by telling the truth."], "sorrowful": ["In the garden, Judas came with soldiers and greeted Jesus with a kiss. A kiss is supposed to show love, but Judas was using it to betray Jesus. That was a lie told with actions instead of words. Jesus answered Judas honestly, asking if he was betraying Him with a kiss. Honesty isn't just about our words; it's also about our actions. Pretending to be nice while secretly being unkind is a kind of lie. Let's make sure our actions and our hearts match.", "Jesus was arrested and beaten because people told lies about Him. False witnesses said things that weren't true, and Jesus suffered because of their lies. Lies can hurt people badly. When we lie about a brother or sister to get them in trouble, we're doing something like those false witnesses did. It may seem small, but it hurts. Jesus suffered silently for the truth. Let's always tell the truth about each other, even when it means we get in trouble instead.", "When Pilate questioned Jesus, Jesus told him the truth: He is a King, and He came into the world to speak the truth. Pilate asked what truth is, and then let the soldiers crown Jesus with thorns and mock Him. Telling the truth cost Jesus a lot. Sometimes telling the truth costs us something too. We might get in trouble, or someone might laugh at us. But Jesus shows us that the truth is always worth it. Let's be brave enough to tell the truth even when it's hard.", "On the way to Calvary, Jesus met the women of Jerusalem who were weeping for Him. Even though He was suffering, Jesus spoke honestly to them and warned them that hard times were coming. Jesus cared enough to tell them the truth. Real friends tell us the truth, even when it's hard. Fibs and flattery might make someone feel good for a moment, but honest love helps them for a lifetime. Let's be the kind of brothers and sisters who love each other enough to be honest. Honesty spoken with love is a true gift.", "Above Jesus' head on the cross was a sign that said He was the King of the Jews. Some people wanted the sign changed, but Pilate refused, and so the sign told the truth. Jesus died for the truth, never once denying who He was. Peter, on the other hand, had said three times that night that he didn't know Jesus. But Peter wept and was sorry, and Jesus forgave him. If we've lied, it's never too late to tell the truth and be forgiven. This week, if any of us has a fib we've been hiding, let's tell the truth to Mom or Dad and say sorry, and let's go to Confession if we can."], "glorious": ["On Easter morning, the women found the tomb empty, and angels told them the truth: Jesus is risen! When the women told the apostles, at first they didn't believe it. Later, some people even spread a lie, saying the disciples had stolen Jesus' body. But the truth could not be hidden. Jesus appeared to His friends again and again, and they became witnesses to the truth. Lies may seem to win for a while, but the truth always wins in the end. When we tell the truth, we're standing on the winning side, with Jesus.", "Before Jesus went up to Heaven, He told His apostles that they would be His witnesses to the ends of the earth. A witness is someone who tells the truth about what they have seen. The apostles spent the rest of their lives telling the truth about Jesus, and many of them died rather than deny it. We are called to be witnesses too. We tell the truth about Jesus with our words and our lives. When people see that we're honest, they'll be more likely to believe us when we tell them about God.", "Jesus called the Holy Spirit the Spirit of Truth. At Pentecost, the Holy Spirit came upon the apostles, and they boldly spoke the truth about Jesus. Peter, who had once been too afraid to admit he knew Jesus, now stood in front of a huge crowd and told everyone the truth. The Holy Spirit turned Peter into a brave truth-teller! The same Holy Spirit has lived in us since our baptism. When we're scared to tell the truth, we can ask the Spirit of Truth to give us courage. He will help us be brave like Peter.", "The Church teaches that Mary was taken body and soul into Heaven. Mary's whole life was honest and pure. She never told a lie, and her words always matched her heart. She kept the truth about Jesus in her heart and thought about it often. Mary loves the truth because she loves Jesus, who is the Truth. When we're tempted to lie, we can ask Mary to help us. A pure heart and honest lips go together.", "Jesus crowned Mary Queen of Heaven and Earth. In Heaven, there are no lies, no secrets, and no pretending. Everything is honest and full of light. Mary, our Queen, wants to help us get ready for Heaven by living in the truth now. Honesty is like a light that keeps our home bright and peaceful, while lies make things dark and confusing. This week, let's thank anyone in our family who tells the truth when it's hard, and let's each try to go the whole week without telling even one small fib."]}},
  {id:"gratitude", name:"Gratitude", draft:true, med:{"joyful": ["When the angel told Mary she would be the Mother of God, her heart was filled with gratitude. Soon after, she sang a beautiful prayer praising God for the great things He had done for her. Mary knew that every good thing she had came from God. Gratitude begins when we notice God's gifts. Every day, God gives us many gifts: our family, our food, our home, and our faith. It's easy to forget to say thank you. Let's be like Mary and praise God for all the great things He has done for us.", "When Mary arrived at Elizabeth's house, Elizabeth cried out with joy, and baby John leaped inside her. Mary answered with her beautiful prayer called the Magnificat, thanking God for His mercy and goodness. Two women, both expecting babies, praised God together. Gratitude spreads joy! When one person in a family says thank you, others start noticing their blessings too. We can make our home a place of thankfulness by saying thank you often. Let's thank God and thank each other every day.", "When Jesus was born, angels filled the sky, praising God and giving Him glory. The shepherds went back to their fields praising God for all they had seen and heard. Jesus was born in a poor stable, but the people around Him were full of thanks. Gratitude doesn't depend on having fancy things. Mary and Joseph had very little, but they had Jesus, and that was everything. When we have Jesus, we have every reason to be thankful. Let's thank God for the gift of Jesus every day.", "When Simeon held baby Jesus in the Temple, he thanked God with all his heart. He had waited his whole life, and now his prayer was answered. Anna, too, gave thanks to God and spoke about Jesus to everyone. Simeon and Anna remind us to thank God when our prayers are answered. Sometimes we pray hard for something, and when God answers, we forget to say thank you. Let's be people who remember. When God answers our prayers, let's thank Him right away.", "When Mary and Joseph found Jesus after three days of searching, imagine how grateful and relieved they felt! They had been so worried, and now their Son was safe. Often we don't realize how thankful we are for someone until we miss them. Our family is a precious gift, and so is each brother and sister. We shouldn't wait until something goes wrong to appreciate each other. This week, let's go around the dinner table each night and have everyone share one thing they're thankful for, including one thing they're thankful for about someone else in the family."], "luminous": ["When Jesus was baptized, the Father spoke from Heaven, saying how much He loved His Son. At our own baptism, God made us His beloved children too. That is the greatest gift we could ever receive! Many of us don't remember our baptism because we were babies. But we can still thank God for it every day. When we bless ourselves with holy water at church, we can remember our baptism and say a quiet thank you. Being a child of God is something to be grateful for always.", "At the wedding in Cana, Jesus turned water into wonderful wine. The head waiter was amazed and told the bridegroom that he had saved the best wine for last. Jesus' gift made the celebration even more joyful. Jesus loves to give good gifts. Sometimes we're so used to our blessings that we stop noticing them, like the water we drink every day. Gratitude helps us see that ordinary things are actually wonderful gifts. Let's try to notice the everyday miracles God gives us.", "Once, Jesus healed ten men who had a terrible skin disease called leprosy. All ten were healed, but only one came back to thank Him. Jesus asked where the other nine were. Jesus noticed who said thank you, and He was pleased with the one who came back. God has done so much for us, and He loves it when we come back to thank Him. Let's be like the one who returned, not the nine who forgot. Let's make thank you one of our favorite words.", "On the mountain, Peter saw Jesus shining in glory, and he was so happy that he said it was good for them to be there. Peter was grateful just to be with Jesus. Sometimes we focus so much on what we want that we forget to be thankful for where we are and who we are with. Being together as a family, praying the rosary right now, is a good thing. It's good for us to be here too! Let's thank God for this moment together and for the people sitting around us.", "At the Last Supper, Jesus took bread, gave thanks, and broke it. The word Eucharist actually means thanksgiving! Every Mass is the Church's great prayer of thanks to God. Even on the night before He died, Jesus gave thanks to His Father. If Jesus could give thanks on His hardest night, we can give thanks every day. This week, let's each write or draw a thank-you note for someone who helps us, like a priest, a grandparent, or a teacher, and let's spend a quiet moment thanking Jesus after Communion at Mass."], "sorrowful": ["In the garden, Jesus prayed in great sorrow, and He accepted the suffering His Father allowed. Even in His agony, Jesus trusted His Father's love. Gratitude isn't only for happy times. St. Paul teaches us to give thanks in all circumstances, because God is always with us. That doesn't mean we pretend to be happy when we're sad. It means we trust that God is still good and still working. When we're having a hard day, we can still find one thing to thank God for.", "Jesus suffered terribly when He was whipped, and He suffered it for us. We are saved because of what He endured. When we think about how much Jesus suffered, our hearts can't help but be grateful. It's easy to complain about little things, like a boring meal, a chore, or a rainy day. But when we remember what Jesus did for us, our complaints seem small. Let's turn our complaints into thank-yous. Instead of grumbling, let's thank Jesus for His love.", "The soldiers mocked Jesus by putting a crown of thorns on His head and a reed in His hand. They pretended He was a king, but He truly is the King of Kings! They didn't recognize the gift standing right in front of them. Sometimes we don't recognize the gifts right in front of us either, like our parents, our brothers and sisters, and our home. An ungrateful heart takes blessings for granted. Let's open our eyes to see how much God has given us, and let's thank Him for our family, even the people who sometimes bother us.", "When Jesus was struggling under the weight of His cross, Simon of Cyrene helped Him carry it, and Veronica wiped His face. These small kindnesses must have meant so much to Jesus. When someone helps us, it's important to notice and say thank you. Moms and dads do so many things for us every day: cooking, cleaning, teaching, driving, and caring for us. Often we don't even notice. Let's thank the people who help carry our burdens. A simple thank you can make someone's whole day.", "On the cross, Jesus gave His life for us. There is no greater gift than that. Whenever we look at a crucifix, we see proof of how much God loves us. The right response to such a great gift is a thankful heart that wants to love Jesus back. The best way to thank Jesus is to live for Him and love others the way He loves us. This week, let's start a family gratitude jar: every day, each of us will write or draw something we're thankful for and put it in the jar, and on Sunday we'll read them together."], "glorious": ["On Easter morning, Jesus rose from the dead! His friends' sorrow turned to joy and thanksgiving. Because Jesus is risen, death is not the end, and we have the hope of Heaven. Every Sunday is like a little Easter, a day to celebrate and thank God for the Resurrection. That's one reason we go to Mass on Sunday! Easter gratitude fills our hearts with joy. Let's thank Jesus for winning the victory over sin and death.", "Before Jesus went up to Heaven, He blessed His apostles. As He rose into the sky, they worshiped Him and returned to Jerusalem full of joy, praising God in the Temple. They were grateful for all that Jesus had done and for His promise to send the Holy Spirit. Praising God is a beautiful way to show our gratitude. We can praise God with songs, with prayers, and with joyful hearts. Even this rosary is a way of thanking God together. Let's be a family that praises God.", "When the Holy Spirit came at Pentecost, the apostles were filled with joy and began praising God in many languages. The Holy Spirit brings us many gifts, like wisdom, understanding, courage, and love. We didn't earn these gifts; God gives them freely. A grateful heart notices the Holy Spirit at work in our lives. When we feel brave, patient, or kind, that's often the Holy Spirit helping us. Let's thank the Holy Spirit for living in us and helping us grow. We can pray, Come, Holy Spirit, every day.", "When Mary's life on earth was finished, God took her body and soul into Heaven. All her life, Mary thanked God for His goodness, and now she praises Him face to face. Heaven is a place of never-ending gratitude and joy. When we practice gratitude on earth, we're getting ready for Heaven. A thankful heart is a happy heart. Let's ask Mary to help us have thankful hearts like hers. She will gladly help her children.", "Jesus crowned His mother Queen of Heaven and Earth. Mary didn't take the credit for herself; she always gave the glory to God. She knew that every good thing in her life was a gift. A grateful heart is humble, because it knows everything comes from God. Mary, our Queen, helps us thank God for all His gifts. This week, let's each thank God by name for three people and three things every night before bed, and let's thank Mary for being our Mother."]}},
  {id:"selfcontrol", name:"Self-Control", draft:true, med:{"joyful": ["When the angel Gabriel appeared to Mary, she was surprised and a little troubled. But instead of panicking, she stayed calm and thought carefully about what the angel said. Then she asked a thoughtful question and listened to the answer. Mary had control over her feelings and her words. Self-control means we don't let our feelings take charge of us. When we feel surprised, scared, or upset, we can stop, breathe, and think before we act. Mary can help us be calm and thoughtful like her.", "When Mary arrived at Elizabeth's house, there was great excitement and joy. But Mary also stayed and helped for three months, doing ordinary work day after day. It takes self-control to keep helping when the exciting part is over and the work becomes routine. It's easy to start a job with energy, but harder to keep going when we get bored. Self-control helps us finish what we start. When we're tired of a chore or schoolwork, we can ask Mary to help us keep going faithfully.", "Joseph had a hard job when Jesus was born. He had to find a place for Mary, protect his family, and later lead them away to Egypt in the middle of the night. Joseph didn't complain or lose his temper. He stayed calm, listened to God, and did what needed to be done. Self-control helped Joseph take good care of his family. When things go wrong, losing our temper only makes it worse. Joseph shows us how to stay calm and do the next right thing.", "When Mary and Joseph presented Jesus in the Temple, Simeon told Mary that a sword of sorrow would pierce her heart. That was frightening news, but Mary didn't fall apart. She kept these words quietly in her heart and trusted God. Self-control includes how we handle bad news or disappointment. We might want to cry, yell, or stomp our feet. Feelings are okay, but we can learn to bring them to God and handle them calmly. Mary can teach us to be peaceful even when we're upset.", "When Jesus was twelve, He stayed in the Temple, and Mary and Joseph searched for Him for three days. When they found Him, Mary was surely relieved and maybe upset, but she spoke to Jesus calmly and told Him how worried they had been without yelling. Mary used self-control with her words, even after three stressful days. It's natural to feel upset, but we can choose to speak gently. Feelings come and go, but our words stay with people. This week, let's practice a family stop-and-breathe: whenever any of us feels angry, we'll stop, take three slow breaths, and quietly pray, Jesus, help me, before we speak."], "luminous": ["Right after His baptism, Jesus went into the desert for forty days to pray and fast. He ate nothing, and He was very hungry. Then the devil came and tempted Him to turn stones into bread. But Jesus said no, choosing to trust His Father instead of giving in. That's self-control! Lent, with its fasting, helps us practice saying no to ourselves so we can say yes to God. When we skip a treat or wait patiently for dinner, we grow stronger, like Jesus in the desert.", "At the wedding in Cana, Jesus provided wonderful wine for the celebration. Weddings are happy parties, and God loves when we celebrate! But even at parties, we need self-control. Good things like food, sweets, and fun are gifts from God, but too much of a good thing can make us feel sick or act silly. Self-control helps us enjoy God's gifts the right way. At the next party, we can enjoy ourselves while still being polite, sharing, and not taking more than our share. That's how we celebrate like Jesus.", "Jesus taught that what comes out of our mouths shows what is in our hearts. Angry words, mean words, and complaining words come from a heart that needs healing. Jesus taught us to be peacemakers and to stop anger before it grows. He even taught that if someone strikes us on one cheek, we should not strike back. That takes a lot of self-control! Our tongue is small, but it can do great good or great harm. Let's ask Jesus to help us control our words.", "On the mountain, Peter was so excited to see Jesus shining in glory that he started talking without really knowing what to say, offering to build tents. While he was still speaking, the Father's voice told them to listen to Jesus. Sometimes we're so eager to talk that we don't listen. Self-control helps us be quiet and listen, especially when someone else is talking. In a big family, everyone wants to talk at once! We can practice self-control by waiting our turn to speak and really listening.", "Before we receive Jesus in Holy Communion, the Church asks us to fast for one hour. That small sacrifice helps prepare our hearts for Jesus, who gave us Himself at the Last Supper. During Mass, we also practice self-control by sitting still, kneeling, and paying attention. These may seem like small things, but they train our hearts to love God more. Self-control is like a muscle that grows stronger every time we use it. This week, let's each give up one treat or some screen time each day and offer it to Jesus as a small gift of love."], "sorrowful": ["In the garden, Jesus felt great fear and sadness. He prayed so hard that His sweat was like drops of blood. His feelings were very strong, but He didn't let them control Him. He brought them to His Father in prayer and chose to do God's will. Self-control doesn't mean we never feel strong emotions. It means we bring our feelings to God and choose to do what's right. When we feel angry, scared, or upset, we can pray like Jesus did in the garden.", "When the soldiers whipped Jesus, He didn't cry out in anger or try to fight back. Jesus had perfect self-control, even in great pain. He could have stopped it at any time, but He chose to suffer for us. Self-control helps us handle pain and frustration without lashing out at others. When we stub a toe or someone bumps into us, we might want to yell or hit. Jesus shows us a better way. Let's ask Him for the strength to stay calm when we're hurting.", "The soldiers mocked Jesus, spit on Him, and laughed at Him. It would be very hard not to answer back! But Jesus stayed silent. His self-control was a sign of His great strength. Sometimes the strongest thing we can do is keep our mouths closed when we want to say something mean. When someone teases us, we don't have to tease back. We can be quiet, walk away, or answer kindly. That kind of self-control takes real strength.", "Carrying the heavy cross, Jesus was exhausted and in pain. He fell more than once, but each time, He got back up and kept going. Self-control helps us keep going when our bodies want to quit. When we're tired of practicing, studying, or doing chores, we can choose to finish instead of giving up. Jesus didn't give in to His tiredness; He kept walking because He loved us. Every time we choose to do the right thing when it's hard, we carry our cross with Jesus. Let's ask Him for strength when we feel like quitting.", "On the cross, people mocked Jesus and told Him to come down if He was really the Son of God. Jesus could have come down, but He stayed on the cross out of love for us. That was the greatest act of self-control in history. Jesus didn't do what was easy or what would prove Himself to others; He did what His Father asked. Self-control means doing what's right instead of what's easy. This week, let's each pick one habit we need to work on, like interrupting, grabbing, or whining, and let's help each other practice self-control with gentle, kind reminders."], "glorious": ["After His Resurrection, Jesus appeared to His apostles. Most of them had run away, and Peter had denied Him, so Jesus could have been upset with them. Instead, He calmly greeted them with peace. Jesus' calm heart made room for peace and forgiveness. When someone has upset us, our first reaction might be to say something sharp. But if we take a moment to calm down, we can respond with peace instead. Peace starts with a calm heart. Let's ask the risen Jesus to fill our hearts with His peace.", "Before Jesus went to Heaven, His apostles asked Him when He would restore the kingdom. Jesus told them it wasn't for them to know the times the Father had set. The apostles had to control their curiosity and trust God with the future. Then Jesus told them to wait in Jerusalem for the Holy Spirit. Waiting takes self-control! Sometimes we want to know everything or have everything right now. Self-control helps us trust God and wait for His timing.", "When the Holy Spirit came at Pentecost, He filled the apostles with His gifts. Self-control is one of the fruits of the Holy Spirit, which means we don't have to do it all on our own. When we feel like we can't control our temper, our words, or our wants, the Holy Spirit can help us. We just need to ask. Every time we pray, Come, Holy Spirit, He helps us grow stronger. Self-control grows in us like fruit on a tree, slowly but surely. Let's be patient as it grows.", "When Mary's life on earth was finished, God took her body and soul into Heaven. Mary lived her whole life with a calm, peaceful heart, fully united with God. She never let anger, greed, or selfishness take control. Her heart belonged completely to God. Self-control is about letting God be in charge of our hearts, instead of our feelings or wants. When we give our hearts to God, like Mary did, we become free and peaceful. Let's ask Mary to help us give our hearts to God every day.", "Jesus crowned Mary Queen of Heaven and Earth. A good queen rules wisely and calmly, and Mary ruled over her own heart long before she was crowned in Heaven. Self-control makes us rulers over ourselves, so our feelings and wants don't rule us. God wants each of us to grow into strong, calm, and wise people. With Mary's help, we can learn to rule our own hearts. This week, let's each choose one time every day to practice self-control on purpose, like waiting a few minutes before having a snack or putting away our toys before playing with something new."]}},
  {id:"teamwork", name:"Working Together", draft:true, med:{"joyful": ["When the angel Gabriel came to Mary, she said yes to working with God on the greatest job in history: bringing Jesus into the world. God could have done it all by Himself, but He chose to work together with Mary. God loves to invite us to work with Him! Every day, God asks us to help Him by loving others and taking care of our family. Mary's yes was joyful and willing. When we're asked to help, we can answer with a cheerful yes like Mary's.", "When Mary heard her cousin Elizabeth was expecting a baby in her old age, Mary hurried to help her. Mary didn't wait to be asked, and she didn't help grumpily. She stayed for three months, cheerfully helping around the house and getting ready for the baby. Mary and Elizabeth worked together and shared their joy. Work is so much better when we do it together with a happy heart. Let's be quick and cheerful helpers like Mary. A cheerful helper makes any job lighter.", "Mary and Joseph worked together as a team to welcome Jesus. Joseph found shelter and made the stable as comfortable as he could. Mary cared for the baby, wrapping Him in cloths and laying Him in the manger. The shepherds and the angels had a part in that holy night too. Every person had a role, and together they welcomed Jesus. In our family, everyone has a part to play. When each of us does our part cheerfully, our home becomes a place where Jesus is welcome.", "Mary and Joseph traveled together to Jerusalem to present Jesus in the Temple. They worked as a team, sharing the journey and caring for their baby together. In the Temple, Simeon and Anna joined them, and together they praised God. God's plans often bring people together to help each other. No one has to do everything alone. When we work together as a family, every job becomes lighter. Let's remember that we're a team, and every member is important.", "When Jesus was missing, Mary and Joseph searched together for three days. They didn't blame each other; they worked as a team until they found Him. Then Jesus went home with them to Nazareth, where He helped Joseph in the carpenter shop and helped His mother around the house. The Holy Family worked together every day, cheerfully and lovingly. Ordinary work, done with love, is holy. This week, let's have a family work time where we all clean or do a project together, with music and smiles, and see how much faster it goes when we work as a team."], "luminous": ["When Jesus was baptized, the whole Holy Trinity was there together: the Father spoke, the Son was baptized, and the Holy Spirit came down like a dove. God Himself is a communion of three Persons who love each other perfectly. Our family is meant to reflect God's love. When we work together in harmony, we show the world a little picture of the Trinity. Arguing about whose turn it is or who did more work breaks that harmony. Let's work together in love, like the Father, Son, and Holy Spirit. Every helpful act makes our home more like Heaven.", "At the wedding in Cana, everyone worked together for the miracle. Mary noticed the problem and told Jesus. The servants filled the huge jars with water, which was hard work. And Jesus turned the water into wine. Jesus could have done it all alone, but He let the servants help. The servants did their part without complaining, even though they didn't know why. When we do our part cheerfully, God can do amazing things through our teamwork.", "Jesus didn't do His work alone. He chose twelve apostles and sent His disciples out two by two to preach and heal. He taught them to work together and help each other. When they argued about who was the greatest, Jesus taught them that the greatest is the one who serves. Teams work best when no one tries to be the boss and everyone tries to serve. In our family, we can stop arguing about who's in charge and start asking how we can help. A helpful heart makes a happy home.", "Jesus took Peter, James, and John up the mountain together. They prayed together and saw Jesus' glory together. Then they came back down, and a crowd was waiting, including a boy who needed healing. Jesus didn't stay on the mountain; He went straight back to helping people. After prayer comes work! Our prayer time together gives us strength to help each other cheerfully. Let's let our rosary tonight make us better helpers tomorrow.", "At the Last Supper, Jesus washed His apostles' feet. He did the lowliest job cheerfully, out of love. Then He gave them the Eucharist and told them to serve one another as He had served them. At Mass, we see people working together: the priest, the altar servers, the readers, the musicians, and everyone praying together. Each person has a part, and every part matters. This week, let's each choose a family job that we'll do every day with a smile and without complaining, and let's cheer each other on when we see someone helping cheerfully."], "sorrowful": ["In the garden, Jesus asked Peter, James, and John to stay awake and pray with Him, but they fell asleep. Jesus needed His friends' help, and they let Him down. Sometimes when our family needs us, we're tired or distracted or just don't feel like helping. Jesus knows how that feels. Let's try to stay alert to the needs of our family. When someone asks for help, let's be ready to answer, even when we're tired. Being there for each other is a way of watching and praying with Jesus.", "When Jesus was whipped, none of His friends were there to help Him. Being alone in suffering is very hard, and Jesus knows what it's like to need help and not get it. In our family, no one should have to struggle alone. When a brother or sister is overwhelmed with chores or schoolwork, we can offer to help. When Mom or Dad looks tired, we can pitch in without being asked. Let's make sure no one in our family ever feels alone. Together, we can carry anything.", "The soldiers worked together, but for something evil: mocking and hurting Jesus. Teamwork can be used for good or for bad. When kids team up to tease someone or leave someone out, that's teamwork going the wrong way. Jesus wants us to team up for good, to help, to include, and to build each other up. Let's never join in when others are being unkind. Instead, let's team up to protect and help those who are hurting. Together, we're stronger for doing good.", "When Jesus was struggling under the weight of His cross, the soldiers made Simon of Cyrene help carry it. Simon may not have wanted to help at first, but he did it anyway. Many believe that Simon and his sons later became followers of Jesus. Sometimes helping others changes us! We might not feel like helping at first, but when we do it, God blesses us. Carrying a heavy load together is always easier than carrying it alone. Let's be like Simon and share each other's burdens.", "At the foot of the cross, Mary, John, and a few faithful women stayed together with Jesus. They comforted each other and stayed with Him to the end. Jesus gave Mary to John and John to Mary, asking them to take care of each other, and from that day John took Mary into his home. Families are meant to stick together, especially in hard times. Jesus wants us to take care of each other too. This week, let's pair up in teams of two, a bigger kid with a littler kid, and help each other with chores, getting ready, and bedtime, the way John cared for Mary."], "glorious": ["On Easter morning, the women went to the tomb together to care for Jesus' body. They worked as a team, bringing spices and wondering together who would roll away the stone. When they found the tomb empty, they ran to tell the apostles. Then Peter and John raced to see the empty tomb for themselves. The first Easter was full of people working and running together! Good news is best shared together. Let's work and celebrate together as a family, especially on Sundays.", "Before Jesus went to Heaven, He gave the apostles a huge job: share the good news with the whole world. No one person could do it alone. They had to work together as one Church. Each apostle went to different places, but they were united in one mission. In our family, we each have different jobs, but we're one team. Some of us cook, some clean, some take care of the little ones, and some help with school. When we all do our part cheerfully, God's work gets done.", "When the Holy Spirit came at Pentecost, the apostles were all together in one place, praying with Mary. The Holy Spirit gives different gifts to different people. St. Paul later taught that the Church is like a body, with many parts working together. The eye needs the hand, and the hand needs the foot. In our family, each person has special gifts. Instead of being jealous of each other's gifts, we can use them together to help everyone. Let's thank the Holy Spirit for making us a team.", "When Mary's life on earth ended, God took her body and soul into Heaven. Mary spent her life cheerfully helping: helping Elizabeth, helping at Cana, and helping the apostles after Jesus went to Heaven. Even now in Heaven, Mary keeps helping us by praying for us. Mary never gets tired of helping her children. Her joy came from serving others with love. A cheerful helper makes everyone around them happier. We can ask Mary to help us be cheerful helpers too.", "Jesus crowned His mother Queen of Heaven and Earth. Mary was the most willing helper in all of God's plan. She always said yes, and she said it cheerfully. St. Paul taught that God loves people who give cheerfully. In God's Kingdom, the cheerful helpers are royalty! This week, let's choose a way to help someone outside our family together as a team, like helping a neighbor rake leaves, cleaning up at church, or bringing a meal to a family who needs one."]}}

/* ---------- Dates ---------- */
const DAY = 864e5;
const ymd = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
function easter(y){ // Anonymous Gregorian algorithm
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da);
}
function adventStart(y){ const xmas=new Date(y,11,25); return addDays(xmas, -(xmas.getDay()||7) - 21); }
function season(d){
  const e=easter(d.getFullYear()), ash=addDays(e,-46), sat=addDays(e,-1);
  if (d>=ash && d<=sat) return "lent";
  const a=adventStart(d.getFullYear()); if (d>=a && d<new Date(d.getFullYear(),11,25)) return "advent";
  return "ordinary";
}
function feastFor(d){
  const y=d.getFullYear(), e=easter(y), t=ymd(d).getTime(), same=x=>ymd(x).getTime()===t;
  const moving=[
    [addDays(e,-46),"Ash Wednesday",""],[addDays(e,-7),"Palm Sunday",""],[addDays(e,-3),"Holy Thursday",""],
    [addDays(e,-2),"Good Friday",""],[addDays(e,-1),"Holy Saturday",""],[e,"Easter Sunday",""],
    [addDays(e,7),"Divine Mercy Sunday",""],[addDays(e,49),"Pentecost",""],[addDays(e,56),"The Most Holy Trinity",""],
    [addDays(e,63),"The Most Holy Body and Blood of Christ",""],[addDays(e,68),"The Most Sacred Heart of Jesus",""],
    [addDays(e,69),"The Immaculate Heart of Mary","Immaculate Heart of Mary, pray for us."],
    [addDays(adventStart(y),-7),"Our Lord Jesus Christ, King of the Universe",""]
  ];
  for (const [dt,n,i] of moving) if (same(dt)) return {name:n, intercession:i};
  const f=FIXED.find(x=>x[0]===d.getMonth()+1 && x[1]===d.getDate());
  return f ? {name:f[2], intercession:f[3]} : null;
}
function autoSet(d, s){
  const dow=d.getDay(), se=season(d);
  if (se==="lent" && s.lent==="daily") return {set:"sorrowful", why:"Sorrowful every day during Lent"};
  if (se==="lent" && s.lent==="sundays" && dow===0) return {set:"sorrowful", why:"Sorrowful on the Sundays of Lent"};
  if (se==="advent" && s.advent==="daily") return {set:"joyful", why:"Joyful every day during Advent"};
  if (se==="advent" && s.advent==="sundays" && dow===0) return {set:"joyful", why:"Joyful on the Sundays of Advent"};
  return {set:BY_DAY[dow], why:"Prayed on "+SETS[BY_DAY[dow]].days};
}


/* ---------- Storage helpers ---------- */
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------- Settings (saved on this device) ---------- */
const DEFAULTS = {sample:false, look:"auto", size:1, lang:"en", parts:true, lent:"daily", advent:"standard", pope:false, michael:true, memorare:false,
  saints:Object.fromEntries(DEFAULT_SAINTS.map(n=>[n,false])), extraSaints:"", feastSaint:true, custom:"", theme:"neighbor"};
let S = load();
function load(){
  const o = store.get("familyRosary.settings");
  if (o){
    if (o.look==null && "night" in o) o.look = o.night ? "night" : "auto";
    delete o.night;
    return {...DEFAULTS, ...o, saints:{...DEFAULTS.saints, ...(o.saints||{})}};
  }
  return structuredClone(DEFAULTS);
}
function save(){ store.set("familyRosary.settings", S); }
function applyLook(){
  const r = document.documentElement;
  if (S.look==="auto") delete r.dataset.theme; else r.dataset.theme = S.look==="night" ? "dark" : "light";
  r.style.setProperty("--scale", S.size);
}

/* ---------- Prayer history: this device, plus your claude.ai account when available ---------- */
const HK = "familyRosary.history";
let HIST = store.get(HK) || {};
let daysCol = null;
async function syncHistory(){
  try{
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    daysCol = db.collection(`data/users/${uid}/days`);
    const snap = await daysCol.get();
    const remote = {};
    snap.docs.forEach(d=>{ const v=d.data(); if (v) remote[d.id] = {n:Math.max(1, +v.n||1), intention:String(v.intention||"")}; });
    let changed = false;
    for (const [k,v] of Object.entries(remote)){
      if (!HIST[k] || HIST[k].n < v.n){ HIST[k] = {n:v.n, intention:v.intention || HIST[k]?.intention || ""}; changed = true; }
    }
    for (const [k,v] of Object.entries(HIST)){
      if (!remote[k] || remote[k].n < v.n) daysCol.doc(k).set({date:k, n:v.n, intention:v.intention||""}).catch(()=>{});
    }
    store.set(HK, HIST);
    if (changed && document.getElementById("heat")) renderHeat();
  }catch(e){}
}
function recordDay(intention){
  const k = iso(new Date()), cur = HIST[k] || {n:0, intention:""};
  const ints = [...new Set([cur.intention, intention.trim()].filter(Boolean))];
  HIST[k] = {n:cur.n+1, intention:ints.join(" · ")};
  store.set(HK, HIST);
  daysCol?.doc(k).set({date:k, n:HIST[k].n, intention:HIST[k].intention}).catch(()=>{});
}

const crossPath = `<path d="M9 0h4v9h9v4h-9v19H9V13H0V9h9z" fill="currentColor"/>`;
function getResume(){ const r = store.get(RK); return r && Date.now()-r.ts < 18*36e5 && SETS[r.set] ? r : null; }

/* ---------- Heat map: one square per day, columns are weeks ---------- */
const WEEKS = 18, MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const lvl = n => n>=3 ? 3 : n;
const dayLabel = d => d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
/* Sample days for previewing the heat map. Built in memory only; never saved or synced. */
const SAMPLE = (()=>{
  const out = {}, ints = ["Grandma's health","our new neighbors","Dad's work","a safe trip","the souls in purgatory","our parish","peace in our home","a friend who is sick"];
  let seed = 7; const rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
  for (let i=0; i<WEEKS*7; i++){
    const d = addDays(today, -i), wk = Math.floor(i/7);
    const odds = wk<4 ? .85 : wk<9 ? .65 : wk<14 ? .45 : .3;
    if (rnd() < odds){
      const r = rnd(), n = d.getDay()===0 && r<.5 ? 2 : r<.06 ? 3 : r<.16 ? 2 : 1;
      out[iso(d)] = {n, intention: rnd()<.7 ? ints[Math.floor(rnd()*ints.length)] : ""};
    }
  }
  return out;
})();
const histData = () => S.sample ? SAMPLE : HIST;
function dayText(k, d){
  const h = histData()[k];
  if (!h) return `${dayLabel(d)} · Not prayed`;
  return `${dayLabel(d)} · ${h.n>1 ? h.n+" rosaries" : "Prayed"}${h.intention ? " for "+h.intention : ""}`;
}
function renderHeat(){
  const host = document.getElementById("heat"); if (!host) return;
  const start = addDays(today, -today.getDay() - (WEEKS-1)*7);
  let html = "", total = 0, week = 0, labeled = -9;
  for (let w=0; w<WEEKS; w++){
    const first = addDays(start, w*7);
    let firstOfMonth = -1;
    for (let d=0; d<7; d++) if (addDays(first,d).getDate()===1) firstOfMonth = addDays(first,d).getMonth();
    if (w===0 && firstOfMonth<0) firstOfMonth = first.getMonth();
    if (firstOfMonth>=0 && w-labeled>=3 && w<=WEEKS-2){ html += `<span class="mo" style="grid-column:${w+2} / span 3">${MON[firstOfMonth]}</span>`; labeled = w; }
    for (let d=0; d<7; d++){
      const day = addDays(first,d), k = iso(day), n = histData()[k]?.n || 0, future = day>today, isToday = +day===+today;
      if (!future) total += n;
      if (w===WEEKS-1 && n) week++;
      html += `<button class="cell l${lvl(n)}${isToday?" today":""}${future?" future":""}" style="grid-column:${w+2};grid-row:${d+2}" data-k="${k}" ${future?'tabindex="-1" aria-hidden="true"':`aria-label="${esc(dayText(k,day))}"`}></button>`;
    }
  }
  ["","M","","W","","F",""].forEach((l,i)=>{ if(l) html += `<span class="dl" style="grid-row:${i+2}" aria-hidden="true">${l}</span>`; });
  host.innerHTML = `<div class="heat" style="--weeks:${WEEKS}" role="group" aria-label="Days we prayed the rosary">${html}</div>`;
  document.getElementById("weekSum").textContent = S.sample ? "Sample days" : week ? `${week} ${week===1?"day":"days"} this week` : "";
  const note = document.getElementById("dayNote");
  note.textContent = total ? `${total} ${total===1?"rosary":"rosaries"} prayed together since ${MON[start.getMonth()]}` : "Each day you finish the rosary fills a square.";
  host.querySelectorAll(".cell:not(.future)").forEach(c=>c.onclick=()=>{
    host.querySelectorAll(".cell.sel").forEach(x=>x.classList.remove("sel")); c.classList.add("sel");
    const [y,m,d] = c.dataset.k.split("-").map(Number);
    note.textContent = dayText(c.dataset.k, new Date(y,m-1,d));
  });
}

/* ---------- Build the rosary ---------- */
/* Beads: 0 crucifix, 1 large, 2-4 small, then per decade a large + 10 small, then the centerpiece medal. */
const BEADS = (()=>{ const b=[{t:"c"},{t:"l"},{t:"s"},{t:"s"},{t:"s"}]; for(let d=0;d<5;d++){ b.push({t:"l"}); for(let i=0;i<10;i++) b.push({t:"s"}); } b.push({t:"m"}); return b; })();
const decadeLarge = d => 5 + d*11;

function begin(set, feast, resume){
  const themeId = resume?.theme || S.theme;
  const theme = THEMES.find(t=>t.id===themeId && t.med) || THEMES[0];
  const st = [];
  const add = (o) => st.push(o);
  add({kind:"intention", bead:null, where:"Before we begin"});
  add({kind:"theme", bead:null, where:"Before we begin"});
  add({kind:"prayer", title:"Sign of the Cross", text:P.sign, bead:0, where:"Opening prayers"});
  add({kind:"prayer", title:"Apostles' Creed", text:P.creed, bead:0, where:"Opening prayers"});
  add({kind:"prayer", title:"Our Father", text:P.ourFather, bead:1, where:"Opening prayers"});
  ["faith","hope","charity"].forEach((v,i)=>add({kind:"prayer", title:"Hail Mary", note:`For an increase of ${v}`, text:P.hailMary, bead:2+i, count:{i:i+1, of:3}, where:`Opening prayers · ${i+1} of 3`}));
  add({kind:"prayer", title:"Glory Be", text:P.glory, bead:5, where:"Opening prayers"});
  for (let d=0; d<5; d++){
    const L = decadeLarge(d), w = `${ORD[d]} decade`;
    add({kind:"mystery", d, set, bead:L, where:w});
    add({kind:"prayer", title:"Our Father", text:P.ourFather, bead:L, where:w});
    for (let i=0;i<10;i++) add({kind:"prayer", title:"Hail Mary", text:P.hailMary, bead:L+1+i, count:{i:i+1, of:10}, decade:d, where:`${w} · Hail Mary ${i+1} of 10`});
    const next = d<4 ? decadeLarge(d+1) : BEADS.length-1;
    add({kind:"prayer", title:"Glory Be", text:P.glory, bead:next, where:w});
    add({kind:"prayer", title:"Fatima Prayer", text:P.fatima, bead:next, where:w});
  }
  const M = BEADS.length-1, cw = "Closing prayers";
  add({kind:"queen", bead:M, where:cw});
  add({kind:"prayer", title:"Let Us Pray", text:P.letUsPray, bead:M, where:cw});
  if (S.pope){
    add({kind:"prayer", title:"Our Father", note:"For the intentions of the Holy Father", text:P.ourFather, bead:M, where:cw});
    add({kind:"prayer", title:"Hail Mary", note:"For the intentions of the Holy Father", text:P.hailMary, bead:M, where:cw});
    add({kind:"prayer", title:"Glory Be", note:"For the intentions of the Holy Father", text:P.glory, bead:M, where:cw});
  }
  if (S.memorare) add({kind:"prayer", title:"The Memorare", text:P.memorare, bead:M, where:cw});
  if (S.michael) add({kind:"prayer", title:"Prayer to St. Michael", text:P.michael, bead:M, where:cw});
  const saints = [];
  if (S.feastSaint && feast && feast.intercession) saints.push(feast.intercession);
  Object.entries(S.saints).forEach(([n,on])=>{ if(on) saints.push(`${n}, pray for us.`); });
  S.extraSaints.split("\n").map(x=>x.trim()).filter(Boolean).forEach(n=>saints.push(/pray for us/i.test(n)?n:`${n}, pray for us.`));
  const uniq = [...new Set(saints)];
  if (uniq.length) add({kind:"saints", list:uniq, bead:M, where:cw});
  S.custom.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(t=>add({kind:"prayer", title:"Our Family's Prayer", text:t, bead:M, where:cw}));
  add({kind:"prayer", title:"Sign of the Cross", text:P.sign, bead:M, where:cw});
  add({kind:"end", bead:null, where:"Amen"});
  steps = st;
  idx = resume ? Math.max(0, Math.min(resume.idx|0, st.length-2)) : 0;
  run = {set, theme:theme.id, intention:resume?.intention || "", recorded:false};
  pray(); requestWake(); saveResume();
}
function saveResume(){
  if (!run) return;
  if (steps[idx]?.kind==="end"){ store.del(RK); return; }
  store.set(RK, {ts:Date.now(), set:run.set, theme:run.theme, idx, intention:run.intention, where:steps[idx]?.where || ""});
}

/* ---------- Prayer screen ---------- */
function pray(){
  shownKey = null;
  app.innerHTML = `
  <div class="mantle" aria-hidden="true"></div>
  <div class="screen">
    <div class="pray-head">
      <div class="beadwrap" aria-hidden="true"><div class="track" id="track">${BEADS.map((b,i)=>`<div class="slot">${b.t==="c"?crossSvg(i):`<span class="bead ${b.t==="s"?"s":b.t==="l"?"l":"medal"}" data-i="${i}"></span>`}</div>`).join("")}</div></div>
      <button class="pause" id="pause">Pause</button>
    </div>
    <p class="where" id="where" aria-live="polite"></p>
    <div class="prayer" id="prayer"></div>
    <div class="pray-foot">
      <button class="back" id="back">Back</button>
      <button class="primary" id="next">Next</button>
    </div>
  </div>`;
  document.getElementById("pause").onclick=confirmPause;
  document.getElementById("back").onclick=()=>go(-1);
  document.getElementById("next").onclick=()=>go(1);
  const pr = document.getElementById("prayer");
  pr.addEventListener("click", e=>{
    if (steps[idx].kind!=="prayer" || e.target.closest("textarea,input,button,a,select,label")) return;
    if (String(window.getSelection?.() || "")) return;
    store.set("familyRosary.tapped", true); go(1);
  });
  let t0 = null;
  pr.addEventListener("touchstart", e=>{ const t=e.touches[0]; t0={x:t.clientX, y:t.clientY}; }, {passive:true});
  pr.addEventListener("touchend", e=>{
    if (!t0) return; const t=e.changedTouches[0], dx=t.clientX-t0.x, dy=t.clientY-t0.y; t0=null;
    if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0 ? 1 : -1);
  }, {passive:true});
  renderStep(true);
}
const crossSvg = i => `<svg class="cross" data-i="${i}" viewBox="0 0 22 32">${crossPath}</svg>`;

function go(n){
  if (n>0 && idx===steps.length-1){ home(); return; }
  const was = idx;
  idx = Math.max(0, Math.min(steps.length-1, idx+n));
  if (idx===was) return;
  if (steps[idx].kind==="end" && !run.recorded){ run.recorded = true; recordDay(run.intention); }
  saveResume();
  renderStep(false);
}

function lastBeadBefore(i){ for(let k=i;k>=0;k--) if(steps[k].bead!=null) return steps[k].bead; return -1; }
const stepKey = s => s.kind==="prayer" && s.count ? `${s.title}|${s.note||""}|${s.where.split(" · ")[0]}` : null;

function positionTrack(first){
  const s = steps[idx], cur = s.bead, done = cur==null ? lastBeadBefore(idx) : cur-1;
  const wrap = document.querySelector(".beadwrap"), track = document.getElementById("track");
  if (!wrap) return;
  const focus = cur!=null ? cur : Math.max(0, done);
  if (first){ track.style.transition="none"; requestAnimationFrame(()=>track.style.transition=""); }
  track.style.transform = `translateX(${wrap.clientWidth/2 - (focus*56 + 28)}px)`;
}

function renderStep(first){
  const s = steps[idx];
  document.getElementById("where").textContent = s.where;
  document.getElementById("back").disabled = idx===0;
  document.getElementById("next").textContent = idx===steps.length-1 ? "Finish" : "Next";
  const cur = s.bead, done = cur==null ? lastBeadBefore(idx) : cur-1;
  document.querySelectorAll("#track [data-i]").forEach(el=>{
    const i=+el.dataset.i; el.classList.toggle("on", i===cur); el.classList.toggle("done", i<=done && i!==cur);
  });
  positionTrack(first);
  const key = stepKey(s), pr = document.getElementById("prayer");
  if (key && key===shownKey && pr.querySelector(".count")){
    updateCount(pr, s);
  } else {
    pr.innerHTML = `<div class="prayer-inner${first?"":" enter"}">${body(s)}</div>`;
    pr.scrollTop = 0;
    const ta = pr.querySelector("#intent");
    if (ta) ta.oninput = e => { run.intention = e.target.value; saveResume(); };
    const opts = pr.querySelectorAll(".theme");
    opts.forEach(b=>b.onclick=()=>{ run.theme=b.dataset.themeId; S.theme=run.theme; save(); saveResume();
      opts.forEach(x=>x.setAttribute("aria-checked", x===b)); });
  }
  shownKey = key;
}
function countHtml(c){ return `<div class="count" role="img" aria-label="Hail Mary ${c.i} of ${c.of}">${Array.from({length:c.of},(_,j)=>`<i class="${j+1<c.i?"done":j+1===c.i?"on":""}"></i>`).join("")}</div>`; }
function updateCount(pr, s){
  const box = pr.querySelector(".count");
  box.setAttribute("aria-label", `Hail Mary ${s.count.i} of ${s.count.of}`);
  box.querySelectorAll("i").forEach((el,j)=>{ el.className = j+1<s.count.i ? "done" : j+1===s.count.i ? "on" : ""; });
  pr.querySelector(".taphint")?.remove();
}

const SPLIT = ["hailMary","ourFather","glory"];
function prayerText(key, text){
  const ps = text.split(/\n\n+/);
  if (S.parts && SPLIT.includes(key) && ps.length===2)
    return `<div class="parts"><div class="part"><span class="who">Leader</span><p>${esc(ps[0])}</p></div><div class="part all"><span class="who">All</span><p>${esc(ps[1])}</p></div></div>`;
  return `<div class="text">${paras(text)}</div>`;
}

function body(s){
  switch(s.kind){
    case "intention": return `<p class="ask">Who are we praying for today?</p>
      <label class="note" for="intent">Talk it over as a family. Write it here and we'll remember it at the end.</label>
      <textarea id="intent" class="intent" rows="2" placeholder="Grandma's surgery, our new neighbors…">${esc(run.intention)}</textarea>`;
    case "theme": return `<p class="ask">What would we like to reflect on as we pray the mysteries?</p>
      <p class="note">Each mystery will include a short meditation on this for the kids.</p>
      <div class="themes" role="radiogroup" aria-label="Meditation theme">${THEMES.map(t=>`<button class="theme" role="radio" data-theme-id="${t.id}" aria-checked="${run.theme===t.id}"><span>${esc(t.name)}</span><span class="dot" aria-hidden="true"></span></button>`).join("")}</div>`;
    case "feast": return `<h1>${esc(s.feast.name)}</h1>
      ${s.feast.intercession ? `<p class="text">${esc(s.feast.intercession)}</p>` : ""}`;
    case "mystery": {
      const th = THEMES.find(x=>x.id===run.theme && x.med) || THEMES[0];
      const t = th.med[s.set][s.d], cut = s.d===4 ? t.indexOf("This week") : -1;
      const main = cut>0 ? t.slice(0,cut).trim() : t, cta = cut>0 ? t.slice(cut) : "";
      return `<p class="kicker">The ${ORD[s.d]} ${esc(SETS[s.set].name.replace(" Mysteries"," Mystery"))}</p>
        <h1>${esc(SETS[s.set].list[s.d])}</h1>
        <p class="meditation">${esc(main)}</p>
        ${cta ? `<div class="cta"><h2>Our mission this week</h2><p class="meditation">${esc(cta)}</p></div>` : ""}`;
    }
    case "queen": {
      const vrEn = `<div class="vr"><span><b>V.</b>Pray for us, O holy Mother of God.</span><span><b>R.</b>That we may be made worthy of the promises of Christ.</span></div>`;
      const vrLa = `<div class="vr"><span><b>V.</b>Ora pro nobis, sancta Dei Genetrix.</span><span><b>R.</b>Ut digni efficiamur promissionibus Christi.</span></div>`;
      if (S.lang==="en") return `<h1>Hail, Holy Queen</h1><div class="text">${paras(P.queen)}</div>${vrEn}`;
      return `<h1>Salve Regina</h1><p class="en-sub">Hail, Holy Queen</p><div class="text">${paras(PL.queen)}</div>${vrLa}
        ${S.lang==="both" ? `<div class="en-under">${paras(P.queen)}${vrEn}</div>` : ""}`;
    }
    case "saints": return `<p class="kicker">Asking the saints for their prayers</p>
      <ul class="saints">${s.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    case "end": {
      const sun = addDays(today, -today.getDay()), I = ["S","M","T","W","T","F","S"];
      const week = I.map((l,d)=>{ const day=addDays(sun,d), k=iso(day), n=HIST[k]?.n||0;
        return `<div><span class="cell l${lvl(n)}${+day===+today?" new":""}${day>today?" future":""}"></span>${l}</div>`; }).join("");
      return `<h1>We have prayed the rosary together.</h1>
        ${run.intention.trim() ? `<p class="offered">Offered for <b>${esc(run.intention.trim())}</b></p>` : ""}
        <div class="week" role="img" aria-label="This week's prayer days">${week}</div>
        <p class="note">Tap Finish to return home.</p>`;
    }
    default: {
      const k = keyOf(s.text), note = s.note ? `<p class="kicker">${esc(s.note)}</p>` : "";
      const count = s.count ? countHtml(s.count) : "";
      const hint = s.count && s.decade===0 && s.count.i===1 && !store.get("familyRosary.tapped") ? `<p class="taphint">Tip: tap anywhere on the prayer to move to the next bead.</p>` : "";
      if (!k || S.lang==="en") return `${note}<h1>${esc(s.title)}</h1>${count}${prayerText(k, s.text)}${hint}`;
      return `${note}<h1>${esc(LT[k])}</h1><p class="en-sub">${esc(s.title)}</p>${count}${prayerText(k, PL[k])}
        ${S.lang==="both" ? `<div class="en-under">${paras(s.text)}</div>` : ""}${hint}`;
    }
  }
}

function confirmPause(){
  const d = document.createElement("div");
  d.className = "sheet";
  d.innerHTML = `<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="xh">
    <h2 id="xh">Pause the rosary?</h2><p class="hint">Your place is saved. Tap Continue on the home screen to pick up right here.</p>
    <div class="row2"><button class="ghost" id="stay">Keep praying</button><button class="solid" id="leave">Pause</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("#stay").focus();
  d.querySelector("#stay").onclick = ()=>d.remove();
  d.querySelector("#leave").onclick = ()=>{ saveResume(); d.remove(); home(); };
  d.onclick = e=>{ if(e.target===d) d.remove(); };
}

/* ---------- Settings ---------- */
function settings(){
  const d = document.createElement("div");
  d.className = "settings";
  const sw = (id, label, sub, on) => `<label class="opt" for="${id}"><span>${label}${sub?`<small>${sub}</small>`:""}</span><input type="checkbox" class="switch" id="${id}" ${on?"checked":""}></label>`;
  const chips = (attr, opts, cur) => opts.map(([v,n])=>`<button class="chip" ${attr}="${v}" aria-pressed="${cur===v}">${n}</button>`).join("");
  d.innerHTML = `
    <div class="topbar"><h2 class="brand" style="font-size:1.4rem">Settings</h2><button class="donebtn" id="done">Done</button></div>
    <div class="scroll">
      <div class="group"><h3>Display</h3>
        <div class="opt"><span>Appearance<small>Auto follows your phone's light or dark setting.</small></span></div>
        <div class="sizes" role="group" aria-label="Appearance">${chips("data-look", [["auto","Auto"],["light","Light"],["night","Night"]], S.look)}</div>
        <div class="opt"><span>Text size</span></div>
        <div class="sizes" role="group" aria-label="Text size">${chips("data-size", [[0.9,"Smaller"],[1,"Standard"],[1.12,"Large"],[1.25,"Largest"]], S.size)}</div>
        ${sw("sample","Preview prayer days with sample data","Fills the home screen squares with made-up days. Your real history isn't changed.", S.sample)}
        ${sw("parts","Show Leader and All parts","Marks who says each half of the Hail Mary, Our Father, and Glory Be", S.parts)}
      </div>
      <div class="group"><h3>Prayer language</h3>
        <label class="opt" for="lang" style="display:grid;gap:6px"><span>Prayers<small>Meditations, intentions, and your own prayers stay in English.</small></span>
          <select id="lang"><option value="en">English</option><option value="la">Latin</option><option value="both">Latin with English below</option></select></label>
      </div>
      <div class="group"><h3>Seasons</h3>
        <label class="opt" for="lent" style="display:grid;gap:6px"><span>During Lent</span>
          <select id="lent"><option value="daily">Sorrowful every day</option><option value="sundays">Sorrowful on Sundays only</option><option value="standard">Follow the regular schedule</option></select></label>
        <label class="opt" for="advent" style="display:grid;gap:6px"><span>During Advent</span>
          <select id="advent"><option value="standard">Follow the regular schedule</option><option value="sundays">Joyful on Sundays only</option><option value="daily">Joyful every day</option></select></label>
      </div>
      <div class="group"><h3>Closing prayers</h3>
        <p class="hint">Hail, Holy Queen and the closing prayer are always included.</p>
        ${sw("pope","Prayers for the Pope's intentions","One Our Father, Hail Mary, and Glory Be", S.pope)}
        ${sw("memorare","The Memorare","", S.memorare)}
        ${sw("michael","Prayer to St. Michael","", S.michael)}
      </div>
      <div class="group"><h3>Saints to ask for prayers</h3>
        ${sw("feastSaint","Today's feast day saint","Added automatically on feast days", S.feastSaint)}
        ${DEFAULT_SAINTS.map((n,i)=>sw("saint"+i, n, "", S.saints[n])).join("")}
        <label for="extraSaints" class="hint">Other saints, one per line</label>
        <textarea id="extraSaints" placeholder="St. Gianna Molla">${esc(S.extraSaints)}</textarea>
      </div>
      <div class="group"><h3>Our family's prayers</h3>
        <label for="custom" class="hint">Each prayer gets its own screen after the closing prayers. Leave a blank line between prayers.</label>
        <textarea id="custom" placeholder="Lord, bless our family and our neighbors...">${esc(S.custom)}</textarea>
      </div>
    </div>`;
  document.body.appendChild(d);
  d.querySelector("#lent").value = S.lent; d.querySelector("#advent").value = S.advent; d.querySelector("#lang").value = S.lang;
  d.querySelector("#lang").onchange = e => { S.lang=e.target.value; save(); };
  const bind = (id, key) => d.querySelector("#"+id).onchange = e => { S[key]=e.target.checked; save(); };
  ["sample","parts","pope","memorare","michael","feastSaint"].forEach(k=>bind(k,k));
  DEFAULT_SAINTS.forEach((n,i)=> d.querySelector("#saint"+i).onchange = e => { S.saints[n]=e.target.checked; save(); });
  const pick = (attr, key, conv) => d.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=()=>{ S[key]=conv(b.getAttribute(attr)); save(); applyLook();
    d.querySelectorAll(`[${attr}]`).forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  pick("data-look","look",String); pick("data-size","size",Number);
  d.querySelector("#lent").onchange = e => { S.lent=e.target.value; save(); };
  d.querySelector("#advent").onchange = e => { S.advent=e.target.value; save(); };
  d.querySelector("#extraSaints").oninput = e => { S.extraSaints=e.target.value; save(); };
  d.querySelector("#custom").oninput = e => { S.custom=e.target.value; save(); };
  d.querySelector("#done").onclick = () => { d.remove(); home(); };
}

/* ---------- Keep the screen awake while praying ---------- */
async function requestWake(){ try{ wake = await navigator.wakeLock?.request("screen"); }catch(e){ wake=null; } }
function releaseWake(){ try{ wake?.release(); }catch(e){} wake=null; }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && run && document.getElementById("next")) requestWake(); });
document.addEventListener("keydown", e=>{
  if (!document.getElementById("next") || document.querySelector(".sheet") || e.target.closest?.("textarea,input,select")) return;
  if (e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); go(1); }
  if (e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
});
window.addEventListener("resize", ()=>{ if(document.getElementById("track")) positionTrack(true); });

applyLook();
home();
syncHistory();
</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
